name: "Notify about updates to Kuma"
on:
  push:
    tags:
      - '*'
    branches:
      - master
      - release-*
permissions:
  contents: read
jobs:
  notify-about-merged-pr:
    timeout-minutes: 10
    name: "Notify about merged PR"
    runs-on: >-
      ${{ fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_RELEASE_2_9_AMD64
      || vars.RUNNERS_AMD64
      || '{}').sm
      || 'ubuntu-24.04' }}
    steps:
      - name: "Generate GitHub app token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.NOTIFY_APP_ID }}
          private-key: ${{ secrets.NOTIFY_APP_PRIVATE_KEY }}
          owner: ${{ secrets.NOTIFY_OWNER }}
          repositories: ${{ secrets.NOTIFY_REPO }}
          permission-contents: write
      - name: "Send repository dispatch event"
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            let branch = process.env.GITHUB_REF_NAME;
            if (process.env.GITHUB_REF_TYPE === "tag") {
              const versionRegex = /v?(\d+)\.(\d+)\.\d+/;
              const versionMatch = process.env.GITHUB_REF_NAME.match(versionRegex);
              if (!versionMatch) {
                return;
              }
              const [_, major, minor] = [...versionMatch];
              branch = `release-${major}.${minor}`;
            }
            return github.rest.repos.createDispatchEvent({
              owner: '${{ secrets.NOTIFY_OWNER }}',
              repo: '${{ secrets.NOTIFY_REPO }}',
              event_type: '${{ secrets.NOTIFY_EVENT_TYPE }}',
              client_payload: {
                branch,
              },
            });
