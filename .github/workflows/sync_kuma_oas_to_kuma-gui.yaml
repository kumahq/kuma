name: Sync Kuma OAS to Kuma GUI

on:
  push:
    branches:
      - master
      - release-[0-9]+.[0-9]+
    paths:
      - 'docs/generated/openapi.yaml'
  workflow_dispatch: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

permissions: {}

jobs:
  dispatch-event:
    if: github.event_name != 'push' || vars.KUMA_CI_SKIP_PUSH != 'true'
    runs-on: >-
      ${{ fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_RELEASE_3_0_AMD64
      || vars.RUNNERS_AMD64
      || '{}').sm
      || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      TARGET_REPO: kuma-gui
      EVENT_TYPE: SYNC_KUMA_OAS
    steps:
      - name: "Generate GitHub app token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ env.TARGET_REPO }}
          permission-contents: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const branch = process.env.GITHUB_REF_NAME;
            github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: '${{ env.TARGET_REPO }}',
              event_type: '${{ env.EVENT_TYPE }}',
              client_payload: {
                branch
              },
            })
