name: "CI gate image"
on:
  push:
    branches: ["master"]
    paths:
      - ".github/actions/cigate/**"
      - "!.github/actions/cigate/*_test.go"
      - ".github/workflows/cigate-image.yaml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  publish:
    name: "Publish the CI gate image"
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/cigate
          sparse-checkout-cone-mode: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: "Read the image the action pins"
        id: image
        env:
          ACTION: .github/actions/cigate/action.yml
        run: |
          set -euo pipefail
          reference="$(yq -r '.runs.image' "${ACTION}")"
          if [[ "${reference}" == "null" || "${reference}" != docker://*:* ]]; then
            echo "::error title=cigate-image::${ACTION} does not pin a docker:// image with a tag, it reads ${reference}"
            exit 1
          fi
          reference="${reference#docker://}"
          printf 'reference=%s\n' "${reference}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${reference##*:}" >> "${GITHUB_OUTPUT}"
          echo "publishing ${reference}"

      - name: "Refuse to move a version that is already published"
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${REFERENCE}" >/dev/null 2>&1; then
            echo "::error title=cigate-image::${REFERENCE} is already published, and the workflows that pin it expect it never to change. Raise the version in .github/actions/cigate/action.yml to publish this build."
            exit 1
          fi
          echo "${REFERENCE} is not published yet"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/actions/cigate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
