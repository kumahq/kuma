name: "CI gate image"
on:
  push:
    branches: ["master", "ci/gate-drafts-and-trust-labels"]
    paths:
      - ".github/actions/cigate/**"
      - "!.github/actions/cigate/*_test.go"
      - "!.github/actions/cigate/action.yml"
      - ".github/workflows/cigate-image.yaml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  publish:
    name: "Publish the CI gate image"
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/cigate
          sparse-checkout-cone-mode: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .github/actions/cigate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kumahq/cigate:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: "Say which digest the action should pin"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "Pin this in \`.github/actions/cigate/action.yml\`:"
            echo
            echo '```yaml'
            echo "  image: docker://ghcr.io/kumahq/cigate@${DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
