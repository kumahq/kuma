name: "CI gate image"
on:
  push:
    branches: ["master", "ci/gate-drafts-and-trust-labels"]
    paths:
      - ".github/actions/cigate/**"
      - ".github/workflows/cigate-image.yaml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  publish:
    name: "Publish the CI gate image"
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/cigate
          sparse-checkout-cone-mode: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: "Read the version the action pins"
        id: version
        env:
          ACTION: .github/actions/cigate/action.yml
        run: |
          set -euo pipefail
          version="$(sed -n 's|.*image: docker://ghcr.io/kumahq/cigate:\(.*\)$|\1|p' "${ACTION}")"
          if [[ -z "${version}" ]]; then
            echo "::error title=cigate-image::could not read the image version out of ${ACTION}"
            exit 1
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          echo "publishing ghcr.io/kumahq/cigate:${version}"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/actions/cigate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kumahq/cigate:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
