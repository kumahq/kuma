name: "release"
run-name: Release${{ inputs.check && ' and check' || '' }} ${{ inputs.release }}

concurrency:
  # `github.ref` is the ref a workflow_dispatch was dispatched from (always `master`),
  # so it does not distinguish releases. Without the release input, dispatches for
  # different versions share one group and GitHub cancels whatever is already queued
  # behind the pending run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release || '0.0.0' }}
  cancel-in-progress: false
on:
  schedule:
    - cron: 0 7 * * *
  workflow_dispatch:
    inputs:
      release:
        description: "the version to publish, if you just want to regen the changelog.md set 0.0.0"
        required: true
        type: string
      check:
        required: false
        type: boolean
        default: false
        description: "check that everything is published correctly"
env:
  CHARTS_REPO: "kumahq/charts"
  BINARIES: "darwin-amd64,darwin-arm64,linux-amd64,linux-arm64"
  DOCKER_REPO: "kumahq"
  DOCKER_IMAGES: "kumactl,kuma-cp,kuma-dp,kuma-init,kuma-cni"
  RELEASE: ${{ inputs.release || '0.0.0' }}
  CHECK: ${{ inputs.check || 'false' }}
  EDITION: kuma
  MIN_VERSION: "2.2.0"
  # renovate: datasource=go depName=ci-tools/release-tool packageName=github.com/kumahq/ci-tools versioning=semver
  RELEASE_TOOL_VERSION: "v1.4.6"
permissions:
  contents: read
jobs:
  release:
    # Headroom for the retried checks below (up to 5 attempts x 3 checks).
    timeout-minutes: 45
    runs-on: ${{ vars.RUNS_ON_MASTER_AMD64 || vars.RUNS_ON_AMD64 || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: "master"
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.11
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: install-kuma-ci-tools
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/kumahq/ci-tools/cmd/release-tool@${{ env.RELEASE_TOOL_VERSION }}
      - name: Generate GitHub app token
        id: github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: create-release
        if: env.RELEASE != '0.0.0'
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          release-tool release changelog --repo ${{ github.repository }} --release ${{ env.RELEASE }}
      # The three checks below are read-only existence probes against artifact stores
      # (charts repo releases, packages.konghq.com, hub.docker.com) that are published
      # by other workflows. Each store lags behind the publishing workflow reporting
      # success, so a check run right after a tag push sees a 404 for artifacts that
      # are fine minutes later. Retry so that propagation lag self-heals instead of
      # needing a manual rerun.
      - name: check-helm
        if: env.RELEASE != '0.0.0' && fromJSON(env.CHECK)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 5
          retry_wait_seconds: 60
          timeout_minutes: 1
          command: release-tool release helm-chart --repo "$GITHUB_REPOSITORY" --charts-repo "$CHARTS_REPO" --release "$RELEASE"
      - name: check-binaries
        if: fromJSON(env.CHECK)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 5
          retry_wait_seconds: 60
          timeout_minutes: 1
          command: release-tool release binaries --repo "$GITHUB_REPOSITORY" --release "$RELEASE" --binaries "$BINARIES"
      - name: check-docker
        if: fromJSON(env.CHECK)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 5
          retry_wait_seconds: 60
          timeout_minutes: 1
          command: release-tool release docker --repo "$GITHUB_REPOSITORY" --release "$RELEASE" --docker-repo "$DOCKER_REPO" --images "$DOCKER_IMAGES"
      - name: update-active-branches.json
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          release-tool version-file --repo ${{ github.repository }} --active-branches > active-branches.json
      - name: update-versions.yml
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          release-tool version-file --repo ${{ github.repository }} --edition ${{ env.EDITION }} --min-version ${{ env.MIN_VERSION }} > versions.yml
      - name: update-CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          release-tool changelog.md --repo ${{ github.repository }} > CHANGELOG.md
      - name: "Create Pull Request"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "docs(CHANGELOG.md): updating changelog and version files"
          signoff: true
          branch: chore/update-changelog
          base: master
          delete-branch: true
          title: "docs(CHANGELOG.md): updating changelog and version files"
          draft: false
          labels: ci/skip-test
          token: ${{ steps.github-app-token.outputs.token }}
          committer: kumahq[bot] <110050114+kumahq[bot]@users.noreply.github.com>
          author: kumahq[bot] <110050114+kumahq[bot]@users.noreply.github.com>
