on:
  workflow_call:
    inputs:
      FULL_MATRIX:
        required: true
        type: string
      ALLOW_PUSH:
        required: true
        type: string
      BINARY_ARTIFACT_NAME:
        required: true
        type: string
      IMAGE_ARTIFACT_NAME:
        required: true
        type: string
      IMAGES:
        required: true
        type: string
      REGISTRY:
        required: true
        type: string
      VERSION_NAME:
        required: true
        type: string
      NOTARY_REPOSITORY:
        required: true
        type: string
      RUNNERS_BY_ARCH:
        required: true
        type: string
    outputs:
      BINARY_ARTIFACT_DIGEST_BASE64:
        value: ${{ jobs.publish-binaries.outputs.BINARY_ARTIFACT_DIGEST_BASE64 }}
      IMAGE_DIGESTS:
        value: ${{ jobs.digest-images.outputs.DIGESTS }}
permissions:
  contents: read
env:
  CI_TOOLS_DIR: ${{ github.workspace }}/.ci_tools
  FULL_MATRIX: ${{ inputs.FULL_MATRIX }}
  ALLOW_PUSH: ${{ inputs.ALLOW_PUSH }}
  GH_OWNER: ${{ github.repository_owner }}
  GH_USER: "github-actions[bot]"
  GH_EMAIL: "<41898282+github-actions[bot]@users.noreply.github.com>"
  GH_REPO: "charts"
  GITHUB_TOKEN: ${{ github.token }}
  MISE_DISABLE_TOOLS: "golangci-lint,skaffold"
jobs:
  # One matrix leg per distribution: cross-compiling all four combos in a
  # single job serialized on one runner's CPUs, and its go.sum-keyed cache
  # entry was immutable, so it decayed until the next dependency bump. Each
  # leg restores its own per-commit build cache by prefix and the envoy
  # download is cached per combo. Cache writes stay off pull requests: an
  # entry saved from a merge ref is restorable only by that same PR, yet the
  # repository cache budget is shared with every branch.
  build-binaries:
    timeout-minutes: 70
    # A darwin leg cross-compiles wherever it lands, so it stays on amd64. An arch with no
    # pool set falls back, which is every arm64 leg today.
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON(inputs.RUNNERS_BY_ARCH)[matrix.os == 'linux' && matrix.arch || 'amd64'].lg
      || 'ubuntu-24.04' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Module contents are a pure function of go.sum, so one immutable entry
      # serves all four legs and stays valid until the next dependency bump.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-dist-${{ hashFiles('**/go.sum') }}
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-dist-${{ runner.os }}-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-dist-${{ runner.os }}-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('**/go.sum') }}-
            go-build-dist-${{ runner.os }}-${{ matrix.os }}-${{ matrix.arch }}-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
      # Resolve through make so per-combo ENVOY_VERSION_<os>_<arch> overrides
      # in mk/build.mk produce distinct cache keys.
      - name: Envoy version
        id: envoy
        run: |
          echo "version=$(make -s build/info GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} | grep '^Envoy=' | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      # A restored directory makes the envoy make target skip its download,
      # which guards on the binary already existing.
      - name: Cache envoy binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/artifacts-${{ matrix.os }}-${{ matrix.arch }}/envoy
          key: envoy-dist-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.envoy.outputs.version }}
      # Command-line variables override the FULL_MATRIX assignment in
      # mk/build.mk, narrowing the job to this leg's combo.
      - run: |
          make -j"$(nproc)" build/distributions ENABLED_GOOSES=${{ matrix.os }} ENABLED_GOARCHES=${{ matrix.arch }}
      # Distributions package only kumactl/kuma-cp/kuma-dp, but image jobs also
      # consume kuma-cni/install-cni from the prebuilt artifact uploaded below.
      - if: ${{ matrix.os == 'linux' }}
        run: |
          make -j"$(nproc)" ENABLED_GOOSES=linux ENABLED_GOARCHES=${{ matrix.arch }} build/kuma-cni build/install-cni
      # Pull requests restore by prefix from the newest push-event entry
      # instead of writing their own short-lived merge-ref entries.
      - name: Save Go build cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-dist-${{ runner.os }}-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      # Image Dockerfiles COPY from this directory. Envoy ships separately:
      # only the kuma-dp/kuma-universal image jobs use it, and at
      # ~100-200MB/arch it would dominate every other job's artifact download.
      - if: ${{ matrix.os == 'linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux_binaries_${{ matrix.arch }}
          path: |
            ./build/artifacts-linux-${{ matrix.arch }}
            !./build/artifacts-linux-${{ matrix.arch }}/envoy
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 10 }}
          if-no-files-found: error
      - if: ${{ matrix.os == 'linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy_linux_${{ matrix.arch }}
          path: ./build/artifacts-linux-${{ matrix.arch }}/envoy
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 10 }}
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-tarballs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ./build/distributions/out/*-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            ./build/distributions/out/*-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 10 }}
          if-no-files-found: error
  # Assembles the per-leg tarballs into the same artifact and digest the
  # single-job build produced, keeping the release surface (artifact name,
  # combined sha256 file, provenance digest, pulp publish) unchanged.
  publish-binaries:
    needs: [build-binaries]
    timeout-minutes: 30
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').md
      || 'ubuntu-24.04' }}
    permissions:
      id-token: write
      contents: read
    outputs:
      BINARY_ARTIFACT_DIGEST_BASE64: ${{ steps.inspect-binary-output.outputs.binary_artifact_digest_base64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-tarballs-*
          path: ./build/distributions/out
          merge-multiple: true
      - id: annotate-image-tag
        name: Image tag
        run: |
          echo "::notice title=Image tag::$(make build/info/version)"
      # Replicates the combined sha256 and base64 digest that
      # mk/distribution.mk derives when all tarballs are built in one job.
      - name: Bundle checksums and digest
        run: |
          version="$(make -s build/info/version)"
          cd build/distributions/out
          sha256sum -- *.tar.gz > "kuma-${version}.sha256"
          base64 -w0 "kuma-${version}.sha256" > ../artifact_digest_file.text
      # Gates publishing, not building: a wrong version must never reach Pulp or
      # Cloudsmith. The assert needs a compiled binary, so pull one linux leg.
      - name: Download linux amd64 binaries for version assert
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux_binaries_amd64
          path: ./build/artifacts-linux-amd64
      # download-artifact does not restore the executable bit, so the binary
      # lands as 0644 and cannot be executed by the version assert.
      - name: Restore executable bit on downloaded binaries
        if: ${{ github.ref_type == 'tag' }}
        run: chmod -R +x ./build/artifacts-linux-amd64
      - name: Assert built binary reports tag version
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          make check/binary-version EXPECTED_VERSION="${TAG_NAME#v}"
      - id: inspect-binary-output
        run: |
          for i in build/distributions/out/*.tar.gz; do echo "$i"; tar -tvf "$i"; done
          echo "Artifact digest:"
          cat ./build/distributions/artifact_digest_file.text
          echo "binary_artifact_digest_base64=$(cat ./build/distributions/artifact_digest_file.text)" > "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: binary-artifacts
        with:
          name: ${{ inputs.BINARY_ARTIFACT_NAME }}
          path: |
            ./build/distributions/out/*.tar.gz
            ./build/distributions/out/*.sha256
            !./build/distributions/out/*.tar.gz.sha256
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 10 }}
      # The release image runs the cloudsmith CLI in a container with no access
      # to the GitHub OIDC endpoint, so the CLI's lazy auth never succeeds
      # there: the token has to be minted on the runner and passed in.
      - name: Get Cloudsmith OIDC token
        id: cloudsmith_token
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e # v3.1.0
        with:
          oidc-namespace: kong
          oidc-service-slug: ${{ contains(inputs.VERSION_NAME, 'preview') && vars.CLOUDSMITH_PREVIEW_SERVICE_ACCOUNT || vars.CLOUDSMITH_PROD_SERVICE_ACCOUNT }}
          export-auth-token: 'true'
      - name: publish binaries
        env:
          PULP_USERNAME: ${{ vars.PULP_USERNAME }}
          PULP_PASSWORD: ${{ secrets.PULP_PASSWORD }}
          CLOUDSMITH_API_KEY: ${{ steps.cloudsmith_token.outputs.oidc-token }}
        run: |
          make publish/pulp
  build-images:
    needs: [build-binaries] # consumes the linux_binaries artifact
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').lg
      || 'ubuntu-24.04' }}
    permissions:
      id-token: write # Required for image signing
      contents: write # needed to upload SBOM assets to GitHub releases
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Built once by build-binaries; PREBUILT_BINARIES=true makes the image
      # targets verify these exist instead of recompiling them. Each artifact
      # holds the directory contents at its root (single-directory uploads do
      # not keep the parent prefix), so each arch lands in its own tree.
      - name: Download prebuilt linux binaries (amd64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux_binaries_amd64
          path: ./build/artifacts-linux-amd64
      - name: Download prebuilt linux binaries (arm64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux_binaries_arm64
          path: ./build/artifacts-linux-arm64
      # Only images built FROM kumahq/envoy need the envoy binary; it is the
      # bulk of the per-arch artifact size, so other jobs skip the download.
      - name: Download envoy binary (amd64)
        if: ${{ matrix.image == 'kuma-dp' || matrix.image == 'kuma-universal' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: envoy_linux_amd64
          path: ./build/artifacts-linux-amd64/envoy
      - name: Download envoy binary (arm64)
        if: ${{ matrix.image == 'kuma-dp' || matrix.image == 'kuma-universal' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: envoy_linux_arm64
          path: ./build/artifacts-linux-arm64/envoy
      # download-artifact does not restore the executable bit, so binaries
      # land as 0644 and COPY would propagate that into the images.
      - name: Restore executable bit on downloaded binaries
        run: chmod -R +x ./build/artifacts-linux-*
      - name: Install dependencies for cross builds
        if: ${{ fromJSON(inputs.FULL_MATRIX) }}
        run: |
          sudo apt-get update; sudo apt-get install -y qemu-user-static binfmt-support
      # Registry layer cache (DOCKER_BUILDX_OPTS in mk/docker.mk) needs the
      # container driver; the default docker driver cannot export cache.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
      # Login must precede the build for the cache push; anonymous pulls of the
      # public cache tags work without it (PR runs).
      - name: Docker login for buildx cache push
        if: ${{ fromJSON(inputs.ALLOW_PUSH) }}
        env:
          DOCKER_API_KEY: ${{ secrets.DOCKER_API_KEY }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
        run: make docker/login
      - id: image_meta
        env:
          REGISTRY: ${{ inputs.REGISTRY }}
          IMAGE_NAME: ${{ matrix.image }}
          VERSION_NAME: ${{ inputs.VERSION_NAME }}
        run: |
          echo "Extracting image meta for $IMAGE_NAME"
          printf 'image=%s/%s:%s\n' "$REGISTRY" "$IMAGE_NAME" "$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - run: |
          make images/${{ matrix.image }} PREBUILT_BINARIES=true DOCKER_BUILDX_CACHE=true
      - run: |
          make docker/save/${{ matrix.image }}
      - name: Run container structure test
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci/skip-container-structure-test') && !contains(github.event.pull_request.labels.*.name, 'ci/skip-test') }}
        run: |
          make test/container-structure/${{ matrix.image }}
      - name: scan amd64 image
        id: scan_image-amd64
        uses: Kong/public-shared-actions/security-actions/scan-docker-image@a92df3beb1e69e27d86be56346488f15fecaf0de # v6.1.1
        with:
          asset_prefix: image_${{ matrix.image }}-amd64
          image: ./build/docker/${{ matrix.image }}-amd64.tar
          upload-sbom-release-assets: true
          skip_cis_scan: false
      - name: scan arm64 image
        id: scan_image-arm64
        if: ${{ fromJSON(inputs.FULL_MATRIX) }}
        uses: Kong/public-shared-actions/security-actions/scan-docker-image@a92df3beb1e69e27d86be56346488f15fecaf0de # v6.1.1
        with:
          asset_prefix: image_${{ matrix.image }}-arm64
          image: ./build/docker/${{ matrix.image }}-arm64.tar
          upload-sbom-release-assets: true
          skip_cis_scan: false
        # TODO in the future we may want to have prerelease images and use `regctl image copy` to move them to their final location
      # Gates the push, not the build: a wrong version must never reach the registry.
      # `docker/info/binary` returns empty for images that ship no versioned CLI
      # (kuma-cni is a plugin binary), and lets distributions that rename images
      # map their own names without patching this workflow.
      - name: Assert built binary reports tag version
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          binary=$(make -s docker/info/binary/${{ matrix.image }})
          if [ -z "${binary}" ]; then
            echo "${{ matrix.image }} ships no versioned CLI, nothing to assert"
            exit 0
          fi
          for arch in $(make -s docker/info/enabled-arches); do
            make check/binary-version \
              BINARY_PATH="build/artifacts-linux-${arch}/${binary}/${binary}" \
              EXPECTED_VERSION="${TAG_NAME#v}"
          done
      - name: publish images
        id: release_images
        env:
          DOCKER_API_KEY: ${{ secrets.DOCKER_API_KEY }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
        run: |-
          make docker/login
          # ensure we always logout
          function on_exit() {
            make docker/logout
          }
          trap on_exit EXIT
          make docker/push/${{ matrix.image }}
          make docker/manifest/${{ matrix.image }}
      - name: Install regctl
        uses: regclient/actions/regctl-installer@f07124ffba4b0cbf96b2a666d481ed9d44b5e7e4
      - name: image digest
        id: image_digest
        if: ${{ fromJSON(inputs.ALLOW_PUSH) }}
        run: |
          echo "Fetching image digest for ${{ matrix.image }}"
          digest=$(regctl image digest "${{ steps.image_meta.outputs.image }}")
          echo "Got digest: $digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "{\"${{matrix.image}}\": \"${digest}\"}" > ./build/docker/${{ matrix.image }}.digest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: image-artifacts
        with:
          name: image_${{ matrix.image }}
          path: |
            ./build/docker/*.tar
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 10 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: image-digest-artifacts
        with:
          name: image_${{ matrix.image }}.digest.json
          path: |
            ./build/docker/${{ matrix.image }}.digest.json
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 10 }}
      - name: sign image
        if: ${{ fromJSON(inputs.ALLOW_PUSH) }}
        id: sign
        uses: Kong/public-shared-actions/security-actions/sign-docker-image@a92df3beb1e69e27d86be56346488f15fecaf0de # v5.0.4
        with:
          image_digest: ${{ steps.image_digest.outputs.digest }}
          tags: ${{ steps.image_meta.outputs.image }}
          signature_registry: ${{ inputs.REGISTRY }}/${{inputs.NOTARY_REPOSITORY}}
          registry_username: ${{ vars.DOCKER_USERNAME }}
          registry_password: ${{ secrets.DOCKER_API_KEY }}
  digest-images:
    needs: [build-images]
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').sm
      || 'ubuntu-24.04' }}
    if: ${{ fromJSON(inputs.ALLOW_PUSH) }}
    outputs:
      DIGESTS: ${{ steps.compute-digests.outputs.digests }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "image_*.digest.json"
          path: ./digests
          merge-multiple: true
      - id: compute-digests
        run: |
          # Create an object of digests indexed by image (.e.g: {"kuma-cp": "sha256:1234", "kuma-dp": "sha256:5678" ...})
          {
            echo "digests<<EOF"
            jq --slurp 'reduce .[] as $item ({}; . * $item)' ./digests/*.digest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
  publish-helm:
    needs: [build-images]
    timeout-minutes: 10
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').md
      || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install dependencies for cross builds
        if: ${{ fromJSON(inputs.FULL_MATRIX) }}
        run: |
          sudo apt-get update; sudo apt-get install -y qemu-user-static binfmt-support
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
      - name: package-helm-chart
        id: package-helm
        env:
          HELM_DEV: ${{ github.ref_type != 'tag' }}
        run: |
          make helm/update-version

          git config user.name "${GH_USER}"
          git config user.email "${GH_EMAIL}"
          git add -u deployments/charts
          # This commit never ends up in the repo
          git commit --allow-empty -m "ci(helm): update versions"
          # To get an idea of what's in the commit to debug
          git show

          make helm/package
          PKG_FILENAME=$(find .cr-release-packages -type f -printf "%f\n")
          echo "filename=${PKG_FILENAME}" >> "$GITHUB_OUTPUT"
      - name: Upload packaged chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package-helm.outputs.filename }}
          path: .cr-release-packages/${{ steps.package-helm.outputs.filename }}
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 10 }}
      # Everything from here is only running on releases.
      # Ideally we'd finish the workflow early, but this isn't possible: https://github.com/actions/runner/issues/662
      - name: Generate GitHub app token
        id: github-app-token
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.GH_REPO }}
      - name: Release chart
        if: ${{ github.ref_type == 'tag' }}
        env:
          GITHUB_APP: "true"
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: make helm/release
