name: "Workflows & Scripts"

# Customize run name to show selected linters in manual runs (e.g., "Validate: actionlint + yamllint")
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    format('Validate: {0}{1}{2}',
      inputs.run_actionlint && 'actionlint' || '',
      inputs.run_actionlint && inputs.run_shellcheck && ' + ' || '',
      inputs.run_shellcheck && 'shellcheck' || ''
    ) ||
    github.event_name
  }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_actionlint:
        description: 'Run actionlint'
        type: boolean
        default: true
      run_shellcheck:
        description: 'Run shellcheck'
        type: boolean
        default: true

permissions:
  contents: read

# Separate concurrency groups for manual vs automatic runs
# Manual: grouped by workflow name (cancels previous manual runs only)
# Automatic: grouped by ref (cancels previous runs on same branch/PR)
concurrency:
  group: >-
    ${{
      github.event_name == 'workflow_dispatch' &&
      format('{0}-manual', github.workflow) ||
      format('{0}-{1}', github.workflow, github.ref)
    }}
  cancel-in-progress: true

jobs:
  workflows:
    name: "Validate Workflows"
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_RELEASE_2_13_AMD64
      || vars.RUNNERS_AMD64
      || '{}').sm
      || 'ubuntu-24.04' }}
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_actionlint ||
      github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            workflows:
              - '.github/workflows/**'


      - name: "Check the runner variable slug matches the branch"
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.workflows == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          # The slug is written by hand at every branch cut, and a missed rename silently
          # falls back to the global variable.
          ref="${BASE_REF:-$REF_NAME}"
          # A manual run sits on whatever branch the UI offered, which has no variables.
          case "${ref}" in
            master|release-*) ;;
            *) echo "${ref} is not a maintained branch, nothing to check"; exit 0 ;;
          esac
          expected=$(printf '%s' "${ref}" | tr '[:lower:]' '[:upper:]' | tr '.-' '__')
          found=$(grep -rhoE 'vars\.RUNNERS_[A-Z0-9_]+_(AMD64|ARM64)' \
            --include='*.yaml' --include='*.yml' .github/workflows \
            | sed -E 's/^vars\.RUNNERS_(.+)_(AMD64|ARM64)$/\1/' | sort -u)
          # PR is a tier, not a branch.
          wrong=$(printf '%s\n' "$found" | grep -vxF "$expected" | grep -vxF PR || true)
          if [ -n "$wrong" ]; then
            echo "::error title=Runner variable slug does not match the branch::expected RUNNERS_${expected}_<ARCH>, found $(printf '%s' "$wrong" | tr '\n' ' ')"
            exit 1
          fi
          echo "Runner variables use RUNNERS_${expected}_<ARCH>"

      - uses: reviewdog/action-actionlint@83e4ed25b168066ad8f62f5afbb29ebd8641d982 # v1.69.1
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.workflows == 'true'
        with:
          github_token: ${{ github.token }}
          reporter: ${{ github.event_name == 'workflow_dispatch' && 'local' || 'github-pr-review' }}
          fail_level: error
          filter_mode: ${{ github.event_name == 'workflow_dispatch' && 'nofilter' || 'diff_context' }}

  shellcheck:
    name: "Validate Shell Scripts"
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_RELEASE_2_13_AMD64
      || vars.RUNNERS_AMD64
      || '{}').sm
      || 'ubuntu-24.04' }}
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_shellcheck ||
      github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            scripts:
              - '**/*.sh'

      - uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1.32.0
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.scripts == 'true'
        with:
          github_token: ${{ github.token }}
          reporter: ${{ github.event_name == 'workflow_dispatch' && 'local' || 'github-pr-review' }}
          fail_level: error
          filter_mode: ${{ github.event_name == 'workflow_dispatch' && 'nofilter' || 'diff_context' }}
          shellcheck_flags: "-P SCRIPTDIR -x"
          pattern: "*.sh"

