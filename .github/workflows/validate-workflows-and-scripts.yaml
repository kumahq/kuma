name: "Workflows & Scripts"

# Customize run name to show selected linters in manual runs (e.g., "Validate: actionlint + yamllint")
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    format('Validate: {0}{1}{2}',
      inputs.run_actionlint && 'actionlint' || '',
      inputs.run_actionlint && inputs.run_shellcheck && ' + ' || '',
      inputs.run_shellcheck && 'shellcheck' || ''
    ) ||
    github.event_name
  }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_actionlint:
        description: 'Run actionlint'
        type: boolean
        default: true
      run_shellcheck:
        description: 'Run shellcheck'
        type: boolean
        default: true

permissions:
  contents: read

# Separate concurrency groups for manual vs automatic runs
# Manual: grouped by workflow name (cancels previous manual runs only)
# Automatic: grouped by ref (cancels previous runs on same branch/PR)
concurrency:
  group: >-
    ${{
      github.event_name == 'workflow_dispatch' &&
      format('{0}-manual', github.workflow) ||
      format('{0}-{1}', github.workflow, github.ref)
    }}
  cancel-in-progress: true

jobs:
  workflows:
    name: "Validate Workflows"
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64) || vars.RUNNERS_MASTER_AMD64 || vars.RUNNERS_AMD64 || '{}').sm || 'ubuntu-24.04' }}
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_actionlint ||
      github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            workflows:
              - '.github/workflows/**'

      - name: "Check the runner variable slug matches the branch"
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.workflows == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          # Variable names take no '-' or '.', and an inline expression cannot sanitize a
          # branch name, so the slug is written by hand at every branch cut. Nothing else
          # catches a missed rename: it silently falls back to the global variable.
          expected=$(printf '%s' "${BASE_REF:-$REF_NAME}" | tr '[:lower:]' '[:upper:]' | tr '.-' '__')
          found=$(grep -rhoE 'vars\.RUNNERS_[A-Z0-9_]+_(AMD64|ARM64)' \
            --include='*.yaml' --include='*.yml' .github/workflows \
            | sed -E 's/^vars\.RUNNERS_(.+)_(AMD64|ARM64)$/\1/' | sort -u)
          # PR is a tier, not a branch: it names the variable a pull_request run prefers.
          wrong=$(printf '%s\n' "$found" | grep -vxF "$expected" | grep -vxF PR || true)
          if [ -n "$wrong" ]; then
            echo "::error title=Runner variable slug does not match the branch::expected RUNNERS_${expected}_<ARCH>, found $(printf '%s' "$wrong" | tr '\n' ' ')"
            exit 1
          fi
          echo "Runner variables use RUNNERS_${expected}_<ARCH>"

      - uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.workflows == 'true'
        with:
          github_token: ${{ github.token }}
          reporter: ${{ github.event_name == 'workflow_dispatch' && 'local' || 'github-pr-review' }}
          fail_level: error
          filter_mode: ${{ github.event_name == 'workflow_dispatch' && 'nofilter' || 'diff_context' }}

  shellcheck:
    name: "Validate Shell Scripts"
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64) || vars.RUNNERS_MASTER_AMD64 || vars.RUNNERS_AMD64 || '{}').sm || 'ubuntu-24.04' }}
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_shellcheck ||
      github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            scripts:
              - '**/*.sh'

      - uses: reviewdog/action-shellcheck@0722bbdb0d47f04c1b53b8734d2422ac63a45ec6 # v1.32.1
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.scripts == 'true'
        with:
          github_token: ${{ github.token }}
          reporter: ${{ github.event_name == 'workflow_dispatch' && 'local' || 'github-pr-review' }}
          fail_level: error
          filter_mode: ${{ github.event_name == 'workflow_dispatch' && 'nofilter' || 'diff_context' }}
          shellcheck_flags: "-P SCRIPTDIR -x"
          pattern: "*.sh"

