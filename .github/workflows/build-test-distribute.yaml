name: "build-test-distribute"
on:
  push:
    branches: ["master", "release-*", "!*-merge-master"]
    tags: ["*"]
  pull_request:
    branches: ["master", "release-*"]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI or via REST call
permissions:
  contents: read
env:
  KUMA_DIR: "."
  # Parent of the checkout, to keep CI tools out of the SBOM.
  CI_TOOLS_DIR: ${{ github.workspace }}/../.ci_tools
  # renovate: datasource=github-tags depName=golangci-lint packageName=golangci/golangci-lint versioning=semver
  GOLANGCI_LINT_VERSION: "v2.13.2"
  MISE_DISABLE_TOOLS: "golangci-lint,skaffold"
concurrency:
  group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name, github.event_name == 'push' && github.sha || github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.ref_name) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  release_sha_gate:
    timeout-minutes: 5
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').sm
      || 'ubuntu-24.04' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: "Check out the CI gate action"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.ref_type == 'tag' }}
        with:
          sparse-checkout: .github/actions/cigate
          sparse-checkout-cone-mode: false
      - name: "Verify tagged SHA has a trusted green push run"
        if: ${{ github.ref_type == 'tag' }}
        uses: ./.github/actions/cigate
        with:
          command: release-gate
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          workflow: build-test-distribute.yaml

  meta:
    needs: ["release_sha_gate"]
    timeout-minutes: 5
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').sm
      || 'ubuntu-24.04' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
    env:
      SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      FULL_MATRIX: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(fromJSON(steps.labels.outputs.json), 'ci/run-full-matrix') }}
      RUN_UNIT: ${{ !github.event.pull_request.draft && !contains(fromJSON(steps.labels.outputs.json), 'ci/skip-test') }}
      RUN_E2E: ${{ !github.event.pull_request.draft && !contains(fromJSON(steps.labels.outputs.json), 'ci/skip-test') && !contains(fromJSON(steps.labels.outputs.json), 'ci/skip-e2e-test') }}
      RUN_CONTAINER_STRUCTURE_TEST: ${{ !contains(fromJSON(steps.labels.outputs.json), 'ci/skip-test') && !contains(fromJSON(steps.labels.outputs.json), 'ci/skip-container-structure-test') }}
      BUILD: ${{ !github.event.pull_request.draft && !(env.SAME_REPO == 'false' && contains(fromJSON(steps.labels.outputs.json), 'ci/force-publish')) && (github.event_name == 'push' || contains(fromJSON(steps.labels.outputs.json), 'ci/run-build') || contains(fromJSON(steps.labels.outputs.json), 'ci/force-publish')) }}
      ALLOW_PUSH: ${{ github.event_name == 'push' || (contains(fromJSON(steps.labels.outputs.json), 'ci/force-publish') && env.SAME_REPO == 'true') }}
      FORCE_PUBLISH_FROM_FORK: ${{ env.SAME_REPO == 'false' && contains(fromJSON(steps.labels.outputs.json), 'ci/force-publish') }}
      DRAFT_NOW: ${{ steps.labels.outputs.draft }}
      # Per-arch lookup, each side independent. See .github/workflows/README.md.
      #   1. fork PR                            -> free GitHub-hosted runners (security)
      #   2. master (push, or PR targeting it)  -> free GitHub-hosted runners
      #   3. vars.RUNNERS_PR_<ARCH>             -> pull_request runs, per-arch
      #   4. vars.RUNNERS_MASTER_<ARCH>         -> per-branch + per-arch override
      #   5. vars.RUNNERS_<ARCH>                -> global per-arch override
      #   6. default                            -> the standard self-hosted Kong pool
      # Each variable is a JSON object of size to label array, spliced in raw, so a caller
      # gets {"<arch>":{"<size>":[labels]}}. An unset arch resolves to {} and the consumer
      # falls back, so adding an arch is setting a variable.
      # `github.base_ref` is empty outside pull_request, where `github.ref_name` is
      # '<number>/merge'. The slug is hardcoded: var names take no '-' or '.', and an
      # inline expression cannot sanitize `github.ref_name`.
      RUNNERS_BY_ARCH: >-
        ${{ ((github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository)
        || (github.base_ref || github.ref_name) == 'master')
        && '{"amd64":{"lg":["ubuntu-24.04"]},"arm64":{"lg":["ubuntu-24.04-arm"]}}'
        || format('{{"amd64":{0},"arm64":{1}}}',
        (github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
        || vars.RUNNERS_MASTER_AMD64 || vars.RUNNERS_AMD64 || '{}',
        (github.event_name == 'pull_request' && vars.RUNNERS_PR_ARM64)
        || vars.RUNNERS_MASTER_ARM64 || vars.RUNNERS_ARM64 || '{}') }}
    steps:
      - name: "Check out the CI gate action"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/cigate
          sparse-checkout-cone-mode: false
      - name: "Decide what this run does, and hold the required check"
        id: labels
        uses: ./.github/actions/cigate
        with:
          command: meta
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  refuse_fork_publish:
    needs: ["meta"]
    if: ${{ needs.meta.outputs.FORCE_PUBLISH_FROM_FORK == 'true' }}
    timeout-minutes: 5
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').sm
      || 'ubuntu-24.04' }}
    steps:
      - run: |
          echo "::error title=Label 'ci/force-publish' cannot be used on PRs from forks::To prevent accidental exposure of secrets, CI won't use repository secrets on pull requests from forks"
          exit 1
  build_check:
    needs: ["release_sha_gate"]
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 20
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').lg
      || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Module contents are a pure function of go.sum, so one immutable entry
      # is shared with every other job and branch.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-dist-${{ hashFiles('**/go.sum') }}
      # Pull requests restore by prefix from the newest push-event entry instead
      # of writing their own short-lived merge-ref entries. A save took 13 minutes
      # when seven runners shared one host's disk.
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-build-${{ runner.os }}-
      - run: go build ./...
      - name: Save Go build cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
  check:
    needs: ["release_sha_gate"]
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: write # needed to upload SBOM assets to GitHub releases
      checks: write # needed for golangci/golangci-lint-action to add code annotations in PRs
      pull-requests: read # needed by paths-filter to access PR file list
    timeout-minutes: 40
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').lg
      || 'ubuntu-24.04' }}
    outputs:
      IMAGES: ${{ steps.metadata.outputs.images }}
      REGISTRY: ${{ steps.metadata.outputs.registry }}
      VERSION_NAME: ${{ steps.metadata.outputs.version }}
      NOTARY_REPOSITORY: ${{ (contains(steps.metadata.outputs.version, 'preview') && 'notary-internal') || 'notary' }}
      CLOUDSMITH_REPOSITORY: ${{ steps.metadata.outputs.distribution_repository }}
    steps:
      - name: "Free up disk space for the Runner"
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            code:
              - '**/*.go'
              - '**/*.proto'
              - 'go.mod'
              - 'go.sum'
              - 'pkg/**'
              - 'api/**'
              - 'tools/**'
              - 'app/**'
            helm:
              - 'deployments/charts/**'
            shell:
              - '**/*.sh'
            dockerfiles:
              - 'tools/releases/dockerfiles/**'
            workflows:
              - '.github/workflows/**'
      - name: Set GOMEMLIMIT dynamically based on available memory
        id: set-gomemlimit
        run: |
          set -e
          # /proc/meminfo reports the host, not the cgroup a containerised runner gets.
          available=$(($(grep MemTotal /proc/meminfo | awk '{print $2}') * 1024))
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory/memory.limit_in_bytes; do
            [ -r "$f" ] || continue
            limit=$(cat "$f")
            case "$limit" in ''|*[!0-9]*) continue ;; esac
            if [ "$limit" -lt "$available" ]; then
              available=$limit
            fi
            break
          done
          gomemlimit=$((available * 8 / 10))
          echo "GOMEMLIMIT=${gomemlimit}" >> "$GITHUB_ENV"
          echo "Setting GOMEMLIMIT to $(numfmt --to=iec "$gomemlimit")"
      # Module contents are a pure function of go.sum, so one immutable entry
      # is shared with every other job and branch.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-dist-${{ hashFiles('**/go.sum') }}
      # Pull requests restore by prefix from the newest push-event entry instead
      # of writing their own short-lived merge-ref entries. A save took 13 minutes
      # when seven runners shared one host's disk.
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-build-${{ runner.os }}-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: ${{ steps.changes.outputs.code == 'true' && github.ref_type != 'tag' }}
        env:
          GOGC: "80" # run GC more aggressively
        with:
          args: --fix=false --verbose
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          only-new-issues: false

      # Lint and "make check" are redundant on a tag: release_sha_gate already
      # requires a green branch push run for this exact tree/SHA. We
      # intentionally keep metadata and SBOM/SCA on tag refs so release tags
      # continue publishing security assets.
      - if: ${{ github.ref_type != 'tag' }}
        run: |
          make clean
      - if: ${{ github.ref_type != 'tag' }}
        run: |
          make check
      - name: Save Go build cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: "Set metadata for downstream jobs"
        id: metadata
        run: |
          {
            echo "images=$(make images/info/release/json)"
            echo "registry=$(make docker/info/registry)"
            echo "version=$(make build/info/version)"
            echo "distribution_repository=$(make build/info/cloudsmith_repository)"
          } >> "$GITHUB_OUTPUT"
      # "make check" puts binaries in ./build/tools (see mk/generate.mk: $(POLICY_GEN)
      # and $(RESOURCE_GEN)), which are unnecessarily included in the SBOM.
      # Running the SCA step before "make check" might seem like a solution, but it
      # generates report files (e.g., sbom.spdx.json, cve-report.json) in the working
      # directory. These files cause "make check" to fail, as it checks if no files
      # in the repository were modified, deleted, or added after its process.
      # It doesn't recognize that the SBOM and CVE report files were added earlier
      # and should be ignored. Since we currently can't change the working directory
      # for the SCA step, it must run after "make check." Instead, we clean ./build
      # after "make check" to exclude tool binaries from the SBOM.
      - run: |
          make clean/build
      - name: "Generate SBOM and CVE report (Software Composition Analysis)"
        id: sca-project
        uses: Kong/public-shared-actions/security-actions/sca@5d8835e25221a4aa16e7a53ab6e97c7fb2528b7e # v6.0.3
        env:
          SYFT_SOURCE_NAME: ${{ github.repository }}
          SYFT_SOURCE_VERSION: ${{ steps.metadata.outputs.version }}
        with:
          dir: .
          config: .syft.yaml
          upload-sbom-release-assets: true
  test:
    needs: ["meta", "build_check"]
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    uses: ./.github/workflows/_test.yaml
    with:
      FULL_MATRIX: ${{ needs.meta.outputs.FULL_MATRIX }}
      RUN_UNIT: ${{ format('{0}', needs.meta.outputs.RUN_UNIT != 'false' && needs.build_check.result == 'success' && github.ref_type != 'tag') }}
      RUN_E2E: ${{ format('{0}', needs.meta.outputs.RUN_E2E != 'false' && needs.build_check.result == 'success' && github.ref_type != 'tag') }}
      IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
      RUNNERS_BY_ARCH: ${{ needs.meta.outputs.RUNNERS_BY_ARCH }}
    secrets: inherit
  build_publish:
    permissions:
      contents: write # needed to upload SBOM assets to GitHub releases
      id-token: write # Required for image signing
    needs: ["check", "meta", "test"]
    uses: ./.github/workflows/_build_publish.yaml
    if: ${{ needs.meta.outputs.BUILD == 'true' }}
    with:
      FULL_MATRIX: ${{ needs.meta.outputs.FULL_MATRIX }}
      ALLOW_PUSH: ${{ needs.meta.outputs.ALLOW_PUSH }}
      RUN_CONTAINER_STRUCTURE_TEST: ${{ needs.meta.outputs.RUN_CONTAINER_STRUCTURE_TEST }}
      IMAGE_ARTIFACT_NAME: "image_artifacts"
      BINARY_ARTIFACT_NAME: "binary_artifacts"
      IMAGES: ${{ needs.check.outputs.IMAGES }}
      REGISTRY: ${{ needs.check.outputs.REGISTRY }}
      NOTARY_REPOSITORY: ${{ needs.check.outputs.NOTARY_REPOSITORY }}
      VERSION_NAME: ${{ needs.check.outputs.VERSION_NAME }}
      RUNNERS_BY_ARCH: ${{ needs.meta.outputs.RUNNERS_BY_ARCH }}
    secrets: inherit
  provenance:
    needs: ["check", "build_publish"]
    if: ${{ github.ref_type == 'tag' }}
    uses: ./.github/workflows/_provenance.yaml
    secrets: inherit
    permissions:
      actions: read # For getting workflow run info to build provenance
      contents: write # To add assets to a release
      id-token: write # For using token to sign images
      packages: write # Required for publishing provenance. Issue: https://github.com/slsa-framework/slsa-github-generator/tree/main/internal/builders/container#known-issues
    with:
      BINARY_ARTIFACTS_HASH_AS_FILE: ${{ needs.build_publish.outputs.BINARY_ARTIFACT_DIGEST_BASE64 }}
      IMAGES: ${{ needs.check.outputs.IMAGES }}
      REGISTRY: ${{ needs.check.outputs.REGISTRY }}
      NOTARY_REPOSITORY: ${{ needs.check.outputs.NOTARY_REPOSITORY }}
      IMAGE_DIGESTS: ${{ needs.build_publish.outputs.IMAGE_DIGESTS }}
  distributions:
    needs: ["release_sha_gate", "meta", "refuse_fork_publish", "build_check", "build_publish", "check", "test", "provenance"]
    permissions:
      id-token: write
    timeout-minutes: 10
    if: ${{ always() }}
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && 'ubuntu-24.04'
      || fromJSON((github.event_name == 'pull_request' && vars.RUNNERS_PR_AMD64)
      || vars.RUNNERS_MASTER_AMD64
      || vars.RUNNERS_AMD64
      || '{}').md
      || 'ubuntu-24.04' }}
    env:
      SECURITY_ASSETS_DOWNLOAD_PATH: "${{ github.workspace }}/security-assets"
      SECURITY_ASSETS_PACKAGE_NAME: "security-assets" # Cloudsmith package for hosting security assets
    steps:
      - name: "Check out the CI gate action"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/cigate
          sparse-checkout-cone-mode: false
      - name: "Halt due to previous failures"
        uses: ./.github/actions/cigate
        with:
          command: halt
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          needs: ${{ toJson(needs) }}
          is-draft: ${{ needs.meta.outputs.DRAFT_NOW }}
      - name: "Download all SBOM assets"
        id: collect_sbom
        if: ${{ needs.build_publish.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ env.SECURITY_ASSETS_DOWNLOAD_PATH }}
          pattern: "*sbom.{cyclonedx,spdx}.json"
          merge-multiple: true
      - name: "Download binary artifact provenance"
        if: ${{ needs.provenance.result == 'success' && github.ref_type == 'tag' }}
        id: collect_provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ env.SECURITY_ASSETS_DOWNLOAD_PATH }}
          pattern: ${{ github.event.repository.name }}.intoto.jsonl
          merge-multiple: true
      - name: "Generate security assets TAR"
        if: ${{ needs.build_publish.result == 'success' }}
        id: security_assets_metadata
        run: |
          cd ${{ env.SECURITY_ASSETS_DOWNLOAD_PATH }}
          find . -maxdepth 1 -type f \( -name '*sbom.*.json' -o -name '*.intoto.jsonl' \) -print | tar -cvzf ${{ env.SECURITY_ASSETS_PACKAGE_NAME }}.tar.gz -T -
          ls -alR .
        # Publish aggregated zip file of SBOMs and/or Binary Provenance to artifact regstry
      - name: Get Cloudsmith OIDC token
        id: cloudsmith_token
        if: ${{ needs.provenance.result == 'success' || needs.build_publish.result == 'success' }}
        uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba # v3.1.1
        with:
          oidc-namespace: kong
          oidc-service-slug: ${{ contains(needs.check.outputs.VERSION_NAME, 'preview') && vars.CLOUDSMITH_PREVIEW_SERVICE_ACCOUNT || vars.CLOUDSMITH_PROD_SERVICE_ACCOUNT }}
      - name: Push security assets to cloudsmith
        id: push_security_assets
        if: ${{ needs.provenance.result == 'success' || needs.build_publish.result == 'success' }}
        uses: cloudsmith-io/action@7af394e0f8add4867bce109385962dafecad1b8d # v0.6.14
        with:
          command: "push"
          format: "raw"
          owner: "kong"
          repo: "${{ needs.check.outputs.CLOUDSMITH_REPOSITORY }}"
          version: "${{ needs.check.outputs.VERSION_NAME }}"
          file: "${{ env.SECURITY_ASSETS_DOWNLOAD_PATH }}/${{ env.SECURITY_ASSETS_PACKAGE_NAME }}.tar.gz"
          name: "${{ env.SECURITY_ASSETS_PACKAGE_NAME }}"
          summary: "SLSA security artifacts for ${{ github.repository }}"
          description: "SBOM and Binary artifact Provenance for ${{ github.repository }}"
          use-executable: "false"
          skip-install-cli: "true"
