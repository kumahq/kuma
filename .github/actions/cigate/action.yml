name: "Kuma CI gate"
description: >-
  Decides what a run does, holds the required check, and refuses a tag whose CI
  did not run. One static binary in a scratch image, so a job pays a pull rather
  than a toolchain.

inputs:
  command:
    description: "release-gate, meta, hold or halt"
    required: true
  token:
    description: "Token the decision reads the API with"
    required: false
    default: ""
  repository:
    description: "owner/repo the decision is about"
    required: false
    default: ""
  pull-request:
    description: "Pull request number, for the meta command"
    required: false
    default: ""
  base-ref:
    description: "Base branch the run was started against, for the meta and halt commands"
    required: false
    default: ""
  head-sha:
    description: "Head commit of the pull request, for the meta and hold commands"
    required: false
    default: ""
  sha:
    description: "Tagged commit, for the release-gate command"
    required: false
    default: ""
  workflow:
    description: "Workflow file the release gate looks for runs of"
    required: false
    default: ""
  needs:
    description: "toJson(needs), for the halt command"
    required: false
    default: "{}"
  is-draft:
    description: "Whether the pull request is a draft now, for the halt command"
    required: false
    default: ""

outputs:
  json:
    description: "The labels the pull request carries now, as a JSON array"
  draft:
    description: "Whether the pull request is a draft now"

runs:
  using: docker
  image: docker://ghcr.io/kumahq/cigate@sha256:1a9bcc565f9cc484dc9b12a4ce358194c6a598e2531489fd3c5bd6c93757cb3a
  args:
    - ${{ inputs.command }}
  env:
    GH_TOKEN: ${{ inputs.token }}
    GH_REPO: ${{ inputs.repository }}
    PR: ${{ inputs.pull-request }}
    HEAD_SHA: ${{ inputs.head-sha }}
    BASE_REF: ${{ inputs.base-ref }}
    SHA: ${{ inputs.sha }}
    WORKFLOW: ${{ inputs.workflow }}
    NEEDS: ${{ inputs.needs }}
    IS_DRAFT: ${{ inputs.is-draft }}
