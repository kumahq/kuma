schemaVersion: 2.0.0

commandTests:
- name: "kumactl binary should return version"
  command: kumactl
  args: ["version"]

fileExistenceTests:
- name: "no busybox shell"
  path: /busybox/sh
  shouldExist: false
- name: "no /bin/sh"
  path: /bin/sh
  shouldExist: false

metadataTest:
  entrypoint: ["/usr/bin/kumactl"]
