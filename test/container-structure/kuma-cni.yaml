schemaVersion: 2.0.0

fileExistenceTests:
- name: "/opt/cni/bin/kuma-cni"
  path: /opt/cni/bin/kuma-cni
  shouldExist: true
  isExecutableBy: any
- name: "/install-cni"
  path: /install-cni
  shouldExist: true
  isExecutableBy: any
- name: "no busybox shell"
  path: /busybox/sh
  shouldExist: false
- name: "no /bin/sh"
  path: /bin/sh
  shouldExist: false

metadataTest:
  entrypoint: ["/install-cni"]
