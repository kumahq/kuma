# MeshTimeout with targetRef to the real MeshService resource
type: MeshTimeout
name: matched-for-rules-mt-1
mesh: mesh-1
spec:
  targetRef:
    kind: Mesh
  to:
    - targetRef:
        kind: MeshService
        labels:
          kuma.io/display-name: backend
      default:
        idleTimeout: 9s
        connectionTimeout: 111s
    - targetRef:
        kind: MeshService
        labels:
          kuma.io/display-name: backend
        sectionName: http-port
      default:
        connectionTimeout: 11s
        http:
          requestTimeout: 12s
---
type: MeshService
name: backend
mesh: mesh-1
labels:
  kuma.io/display-name: backend
spec:
  selector:
    dataplaneTags:
      app: backend
  ports:
    - port: 80
      targetPort: 80
      appProtocol: http
      name: http-port
---
type: Mesh
name: mesh-1
