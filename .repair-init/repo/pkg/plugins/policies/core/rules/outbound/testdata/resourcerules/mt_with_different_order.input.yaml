# MeshTimeout with different ordering of items in the to[] array
type: MeshHTTPRoute
name: http-route-1
mesh: mesh-1
labels:
  kuma.io/display-name: http-route-1
spec:
  to:
    - targetRef:
        kind: MeshService
        labels:
          kuma.io/display-name: backend
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api
          default:
            backendRefs:
              - kind: MeshService
                labels:
                  kuma.io/display-name: backend
                weight: 70
              - kind: MeshService
                labels:
                  kuma.io/display-name: backend-v2
                weight: 30
---
type: MeshTimeout
name: matched-for-rules-mt-1
mesh: mesh-1
spec:
  to:
    - targetRef:
        kind: MeshService
        labels:
          kuma.io/display-name: backend-v2
      default:
        connectionTimeout: 5s
    - targetRef:
        kind: MeshHTTPRoute
        labels:
          kuma.io/display-name: http-route-1
      default:
        http:
          requestTimeout: 20s
    - targetRef:
        kind: MeshService
        labels:
          kuma.io/display-name: backend
      default:
        idleTimeout: 25s
        http:
          requestTimeout: 15s
---
type: MeshService
name: backend
mesh: mesh-1
labels:
  kuma.io/display-name: backend
spec:
  selector:
    dataplaneTags:
      app: backend
  ports:
    - port: 80
      targetPort: 80
      appProtocol: http
---
type: MeshService
name: backend-v2
mesh: mesh-1
labels:
  kuma.io/display-name: backend-v2
spec:
  selector:
    dataplaneTags:
      app: backend-v2
  ports:
    - port: 80
      targetPort: 80
      appProtocol: http
---
type: Mesh
name: mesh-1
