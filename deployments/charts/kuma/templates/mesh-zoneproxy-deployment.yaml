{{- range $meshEntry := .Values.meshes }}
{{- $meshName := $meshEntry.name }}
{{- if not $meshName }}
{{- fail "each meshes entry must have a name" }}
{{- end }}

{{- /* Build list of enabled roles with their defaults from meshZoneProxyDefaults */ -}}
{{- $roles := list }}
{{- if and $meshEntry.ingress $meshEntry.ingress.enabled }}
{{- $roles = append $roles (dict "role" "ingress" "cfg" $meshEntry.ingress "defaults" $.Values.meshZoneProxyDefaults.ingress) }}
{{- end }}
{{- if and $meshEntry.egress $meshEntry.egress.enabled }}
{{- $roles = append $roles (dict "role" "egress" "cfg" $meshEntry.egress "defaults" $.Values.meshZoneProxyDefaults.egress) }}
{{- end }}

{{- /* Validate mode only when deploying zone proxies */ -}}
{{- if $roles }}
{{- if eq $.Values.controlPlane.mode "global" }}
{{- fail (printf "meshes[%s]: mesh-scoped zone proxies require controlPlane.mode=zone" $meshName) }}
{{- end }}
{{- end }}

{{- range $roleEntry := $roles }}
{{- $role := $roleEntry.role }}
{{- $cfg := $roleEntry.cfg }}
{{- $defaults := $roleEntry.defaults }}
{{- $dep := $cfg.deployment | default dict }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuma.mesh.zoneproxy.name" (dict "root" $ "meshName" $meshName "role" $role) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kuma.mesh.zoneproxy.labels" (dict "root" $ "meshName" $meshName "role" $role) | nindent 4 }}
    {{- with $dep.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $dep.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- if not (and $cfg.hpa $cfg.hpa.enabled) }}
  replicas: {{ include "kuma.mesh.zoneproxy.setting" (dict "cfg" $dep "defaults" $defaults "field" "replicas") }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kuma.mesh.zoneproxy.selectorLabels" (dict "root" $ "meshName" $meshName "role" $role) | nindent 6 }}
  template:
    {{- /* Keep the chart and app version out of the pod template: a change
           rolls the zone proxies on every control plane upgrade, while the
           old control plane still injects, so they return with the old
           kuma-dp. Operators restart them after the upgrade instead. A
           chart-rendered ConfigMap or Secret mounted here needs a checksum/
           annotation of a template that renders no version labels. */}}
    metadata:
      annotations:
        kuma.io/reachable-backends: '{"refs":[]}'
        {{- with $dep.podAnnotations }}
        {{- if hasKey . "kuma.io/reachable-backends" }}
        {{- fail (printf "meshes[%s].%s.deployment.podAnnotations: kuma.io/reachable-backends is set by the chart" $meshName $role) }}
        {{- end }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- $podLabels := include "kuma.mesh.zoneproxy.podLabels" (dict "root" $ "meshName" $meshName "role" $role) }}
        {{- $chartLabels := fromYaml $podLabels }}
        {{- range $key, $value := $dep.podLabels }}
        {{- if hasKey $chartLabels $key }}
        {{- fail (printf "meshes[%s].%s.deployment.podLabels: %s is set by the chart" $meshName $role $key) }}
        {{- end }}
        {{- end }}
        {{- $podLabels | nindent 8 }}
        {{- with $dep.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if and $dep.podSpec $dep.podSpec.resources }}
      resources: {{ toYaml $dep.podSpec.resources | nindent 8 }}
      {{- end }}
      {{- with (and $dep.podSpec $dep.podSpec.affinity) }}
      affinity: {{ tpl (toYaml . | nindent 8) $ }}
      {{- end }}
      {{- with (and $dep.podSpec $dep.podSpec.topologySpreadConstraints) }}
      topologySpreadConstraints: {{ tpl (toYaml . | nindent 8) $ }}
      {{- end }}
      {{- with (and $dep.podSpec $dep.podSpec.priorityClassName) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if and $dep.podSpec $dep.podSpec.securityContext }}
      securityContext:
      {{- toYaml $dep.podSpec.securityContext | trim | nindent 8 }}
      {{- else }}
      securityContext:
        runAsUser: 5678
        runAsGroup: 5678
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      serviceAccountName: {{ include "kuma.mesh.zoneproxy.name" (dict "root" $ "meshName" $meshName "role" $role) }}
      automountServiceAccountToken: {{ include "kuma.mesh.zoneproxy.setting" (dict "cfg" $cfg "defaults" $defaults "field" "automountServiceAccountToken") }}
      restartPolicy: {{ include "kuma.mesh.zoneproxy.setting" (dict "cfg" $cfg "defaults" $defaults "field" "restartPolicy") }}
      {{- with (and $dep.podSpec $dep.podSpec.nodeSelector) }}
      nodeSelector:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with (and $dep.podSpec $dep.podSpec.tolerations) }}
      tolerations:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ include "kuma.mesh.zoneproxy.setting" (dict "cfg" $cfg "defaults" $defaults "field" "terminationGracePeriodSeconds") }}
      containers:
        - name: pause
          image: {{ include "kuma.mesh.zoneproxy.image" (dict "root" $ "cfg" $cfg "meshName" $meshName "role" $role) | quote }}
          imagePullPolicy: {{ include "kuma.mesh.zoneproxy.setting" (dict "cfg" $cfg "defaults" $defaults "field" "imagePullPolicy") }}
          {{- if and $dep.podSpec $dep.podSpec.containerSecurityContext }}
          securityContext:
          {{- toYaml $dep.podSpec.containerSecurityContext | trim | nindent 12 }}
          {{- else }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- end }}
          {{- if and $dep.podSpec $dep.podSpec.containerResources }}
          resources: {{ toYaml $dep.podSpec.containerResources | nindent 12 }}
          {{- else }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 16Mi
          {{- end }}
          {{- /* A terminating zone proxy has to keep serving until clients stop
                 picking it. Zone egress clients use the pod IP straight out of
                 EDS, which costs the store cache TTL plus the xDS refresh interval
                 plus the push. Zone ingress is reached through its Service, and the
                 load balancer and kube-proxy drop a terminating pod asynchronously,
                 so remote zones keep landing on it for a few seconds. */}}
          {{- $preStopSleep := int (include "kuma.mesh.zoneproxy.setting" (dict "cfg" $cfg "defaults" $defaults "field" "preStopSleepSeconds")) }}
          {{- if gt $preStopSleep 0 }}
          {{- $grace := int (include "kuma.mesh.zoneproxy.setting" (dict "cfg" $cfg "defaults" $defaults "field" "terminationGracePeriodSeconds")) }}
          {{- if ge $preStopSleep $grace }}
          {{- fail (printf "meshes[%s].%s: preStopSleepSeconds (%d) must be lower than terminationGracePeriodSeconds (%d), otherwise the pod is killed before the hook completes" $meshName $role $preStopSleep $grace) }}
          {{- end }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $preStopSleep }}
          {{- end }}
{{- end }}

{{- end }}
