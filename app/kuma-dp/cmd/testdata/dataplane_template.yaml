type: Dataplane
mesh: default
name: {{ name }}
networking:
  address: {{ address }}
  inbound:
    - port: 11011
      servicePort: 11012
      tags:
        kuma.io/display-name: backend
        kuma.io/protocol: http
  outbound:
    - port: 33033
      backendRef:
        kind: MeshService
        name: redis
        port: 6379
  admin:
    port: 9901
