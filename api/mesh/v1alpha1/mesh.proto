syntax = "proto3";

package kuma.mesh.v1alpha1;

import "api/mesh/options.proto";

option go_package = "github.com/kumahq/kuma/v3/api/mesh/v1alpha1";

// Mesh defines configuration of a single mesh.
message Mesh {
  option (kuma.mesh.resource).name = "MeshResource";
  option (kuma.mesh.resource).type = "Mesh";
  option (kuma.mesh.resource).global = true;
  option (kuma.mesh.resource).package = "mesh";
  option (kuma.mesh.resource).kds = "model.GlobalToZonesFlag";
  option (kuma.mesh.resource).ws.name = "mesh";
  option (kuma.mesh.resource).ws.plural = "meshes";
  option (kuma.mesh.resource).has_insights = true;
  option (kuma.mesh.resource).short_name = "m";

  reserved 1;
  reserved "mtls";

  reserved 2;
  reserved "tracing";

  reserved 3;
  reserved "logging";

  reserved 4;
  reserved "metrics";

  reserved 5;
  reserved "networking";

  reserved 6;
  reserved "routing";

  reserved 7;
  reserved "constraints";

  reserved 8;
  reserved "skipCreatingInitialPolicies";

  // Deprecated: 3.0 removed the MeshService mode from the Mesh API and every
  // mesh behaves as if meshServices.mode was Exclusive. The field only
  // remains so a global control plane can keep marking meshes as Exclusive
  // when it syncs them over KDS to zones older than 3.0: those zones read a
  // missing field as Disabled and tear down all MeshService traffic
  // (https://github.com/kumahq/kuma/issues/18868). Any value stored through
  // the API has no effect on 3.0 control planes.
  MeshServices meshServices = 9 [deprecated = true];

  message MeshServices {
    Mode mode = 1;

    enum Mode {
      // MeshServices aren't generated
      Disabled = 0;
      // MeshServices are generated and used for configuration
      Everywhere = 1;
      // MeshServices are generated but only used for configuration where
      // configured via reachableBackends
      ReachableBackends = 2;
      // MeshServices are generated, used for configuration and kuma.io/services
      // are not used
      Exclusive = 3;
    }
  }
}
