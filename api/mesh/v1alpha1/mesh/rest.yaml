components:
  responses:
    MeshCreateOrUpdateSuccessResponse:
      content:
        application/json:
          schema:
            properties:
              warnings:
                description: |
                  warnings is a list of warning messages to return to the requesting Kuma API clients.
                  Warning messages describe a problem the client making the API request should correct or be aware of.
                items:
                  type: string
                readOnly: true
                type: array
            type: object
      description: Successful response
    MeshDeleteSuccessResponse:
      content:
        application/json:
          schema:
            type: object
      description: Successful response
    MeshItem:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MeshItem'
      description: Successful response
    MeshList:
      content:
        application/json:
          schema:
            properties:
              items:
                items:
                  $ref: '#/components/schemas/MeshItem'
                type: array
              next:
                description: URL to the next page
                type: string
              total:
                description: The total number of entities
                type: number
            type: object
      description: List
  schemas:
    MeshItem:
      properties:
        creationTime:
          description: Time at which the resource was created
          format: date-time
          readOnly: true
          type: string
        kri:
          description: Kuma Resource Identifier (KRI) of the given resource
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        modificationTime:
          description: Time at which the resource was updated
          format: date-time
          readOnly: true
          type: string
        name:
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          type: string
        skipCreatingInitialPolicies:
          description: |-
            List of policies to skip creating by default when the mesh is created.
            e.g. TrafficPermission, MeshRetry, etc. An '*' can be used to skip all
            policies.
          items:
            type: string
          type: array
        type:
          type: string
      required:
      - type
      - name
      type: object
info:
  description: Kuma API
  title: Kuma API
  version: v1alpha1
openapi: 3.1.0
paths:
  /meshes:
    get:
      operationId: getMeshList
      parameters:
      - description: offset in the list of entities
        example: 0
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: the number of items per page
        in: query
        name: size
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          type: integer
      - description: filter by labels when multiple filters are present, they are
          ANDed
        example:
          label.k8s.kuma.io/namespace: my-ns
        in: query
        name: filter
        required: false
        schema:
          properties:
            key:
              type: string
            value:
              type: string
          type: object
      responses:
        "200":
          $ref: '#/components/responses/MeshList'
      summary: Returns a list of Mesh in the mesh.
      tags:
      - Mesh
  /meshes/{name}:
    delete:
      operationId: deleteMesh
      parameters:
      - description: name of the Mesh
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          $ref: '#/components/responses/MeshDeleteSuccessResponse'
        "404":
          $ref: ../../base/specs/common/error_schema.yaml#/components/responses/NotFound
      summary: Deletes Mesh entity
      tags:
      - Mesh
    get:
      operationId: getMesh
      parameters:
      - description: name of the Mesh
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          $ref: '#/components/responses/MeshItem'
        "404":
          $ref: ../../base/specs/common/error_schema.yaml#/components/responses/NotFound
      summary: Returns Mesh entity
      tags:
      - Mesh
    put:
      operationId: putMesh
      parameters:
      - description: name of the Mesh
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshItem'
        description: Put request
        required: true
      responses:
        "200":
          $ref: '#/components/responses/MeshCreateOrUpdateSuccessResponse'
        "201":
          $ref: '#/components/responses/MeshCreateOrUpdateSuccessResponse'
      summary: Creates or Updates Mesh entity
      tags:
      - Mesh
