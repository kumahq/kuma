openapi: 3.1.0
info:
  version: v1alpha1
  title: Kuma API
  description: Kuma API
  x-ref-schema-name: "DataplaneOverview"

paths:
  /meshes/{mesh}/dataplanes/{name}/_overview:
    get:
      operationId: getDataplaneOverview
      parameters:
        - in: path
          name: mesh
          required: true
          description: The mesh of the DPP to get the diff for.
          schema:
            type: string
        - in: path
          name: name
          required: true
          description: The name of the DPP within the mesh to get the diff for.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetDataplaneOverviewResponse'
        '400':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/BadRequest'
        '500':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/Internal'
  /meshes/{mesh}/dataplanes/_overview:
    get:
      operationId: getDataplaneOverviewList
      parameters:
        - in: path
          name: mesh
          required: true
          description: The mesh of the DPP to get the diff for.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetDataplaneOverviewListResponse'
        '400':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/BadRequest'
        '500':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/Internal'

components:
  schemas:
    DataplaneOverviewWithMeta:
      allOf:
        # A DataplaneOverview carries the meta of its base Dataplane, so it has a
        # mesh and a kri (Dataplane has a short name). The shared Meta does not
        # fit: it requires labels, which are only present when the store computes
        # them (e.g. kuma.io/display-name on Kubernetes).
        - type: object
          required: [type, mesh, name]
          properties:
            type:
              type: string
              example: DataplaneOverview
              description: the type of this resource
            mesh:
              type: string
              example: default
              description: the mesh this overview is part of
              # keep in sync with core_mesh.MeshNamePattern / MaxNameLength
              pattern: '^[0-9a-z-_.]*$'
              maxLength: 253
            name:
              type: string
              example: dp-1
              description: the name of the dataplane this overview describes
            kri:
              type: string
              readOnly: true
              description: Kuma Resource Identifier (KRI) of the given resource
            labels:
              type: object
              additionalProperties:
                type: string
              description: Labels computed by the control plane, if any.
            creationTime:
              type: string
              format: date-time
              readOnly: true
              description: Time at which the resource was created
            modificationTime:
              type: string
              format: date-time
              readOnly: true
              description: Time at which the resource was updated
        - $ref: '/specs/protoresources/dataplaneoverview/schema.yaml#/components/schemas/DataplaneOverview'

  responses:
    GetDataplaneOverviewResponse:
      description: A response containing the overview of a dataplane.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataplaneOverviewWithMeta'
    GetDataplaneOverviewListResponse:
      description: A response containing the overview of a dataplane.
      content:
        application/json:
          schema:
            type: object
            required: [total, items, next]
            properties:
              total:
                type: integer
                example: 200
              next:
                type:
                  - string
                  - 'null'
                description: URL to the next page, or null when this is the last page
              items:
                type: array
                items:
                  $ref: '#/components/schemas/DataplaneOverviewWithMeta'
