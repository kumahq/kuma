components:
  schemas:
    MeshInsight:
      description: MeshInsight defines the observed state of a Mesh.
      properties:
        dataplanes:
          description: Dataplanes aggregates over the dataplanes of the mesh.
          properties:
            offline:
              description: Offline counts the dataplanes that are not connected.
              type: integer
            online:
              description: Online counts the dataplanes that are connected.
              type: integer
            partiallyDegraded:
              description: PartiallyDegraded counts the dataplanes with some inbounds
                offline.
              type: integer
            total:
              type: integer
          type: object
        dataplanesByType:
          description: DataplanesByType splits the dataplane stats by proxy type.
          properties:
            gateway:
              description: Gateway holds the stats of every gateway dataplane.
              properties:
                offline:
                  description: Offline counts the dataplanes that are not connected.
                  type: integer
                online:
                  description: Online counts the dataplanes that are connected.
                  type: integer
                partiallyDegraded:
                  description: PartiallyDegraded counts the dataplanes with some inbounds
                    offline.
                  type: integer
                total:
                  type: integer
              type: object
            gatewayDelegated:
              description: GatewayDelegated holds the stats of the delegated gateway
                dataplanes.
              properties:
                offline:
                  description: Offline counts the dataplanes that are not connected.
                  type: integer
                online:
                  description: Online counts the dataplanes that are connected.
                  type: integer
                partiallyDegraded:
                  description: PartiallyDegraded counts the dataplanes with some inbounds
                    offline.
                  type: integer
                total:
                  type: integer
              type: object
            standard:
              description: Standard holds the stats of the dataplanes that are not
                gateways.
              properties:
                offline:
                  description: Offline counts the dataplanes that are not connected.
                  type: integer
                online:
                  description: Online counts the dataplanes that are connected.
                  type: integer
                partiallyDegraded:
                  description: PartiallyDegraded counts the dataplanes with some inbounds
                    offline.
                  type: integer
                total:
                  type: integer
              type: object
          type: object
        dpVersions:
          description: DpVersions holds the dataplane stats grouped by version.
          properties:
            envoy:
              additionalProperties:
                description: MeshInsight_DataplaneStat defines statistics specifically
                  for Dataplanes.
                properties:
                  offline:
                    description: Offline counts the dataplanes that are not connected.
                    type: integer
                  online:
                    description: Online counts the dataplanes that are connected.
                    type: integer
                  partiallyDegraded:
                    description: PartiallyDegraded counts the dataplanes with some
                      inbounds offline.
                    type: integer
                  total:
                    type: integer
                type: object
              description: Envoy holds the dataplane stats grouped by Envoy version.
              type: object
            kumaDp:
              additionalProperties:
                description: MeshInsight_DataplaneStat defines statistics specifically
                  for Dataplanes.
                properties:
                  offline:
                    description: Offline counts the dataplanes that are not connected.
                    type: integer
                  online:
                    description: Online counts the dataplanes that are connected.
                    type: integer
                  partiallyDegraded:
                    description: PartiallyDegraded counts the dataplanes with some
                      inbounds offline.
                    type: integer
                  total:
                    type: integer
                type: object
              description: KumaDp holds the dataplane stats grouped by KumaDP version.
              type: object
          type: object
        mTLS:
          description: MTLS holds the dataplane stats grouped by certificate backend.
          properties:
            issuedBackends:
              additionalProperties:
                description: MeshInsight_DataplaneStat defines statistics specifically
                  for Dataplanes.
                properties:
                  offline:
                    description: Offline counts the dataplanes that are not connected.
                    type: integer
                  online:
                    description: Online counts the dataplanes that are connected.
                    type: integer
                  partiallyDegraded:
                    description: PartiallyDegraded counts the dataplanes with some
                      inbounds offline.
                    type: integer
                  total:
                    type: integer
                type: object
              description: |-
                IssuedBackends groups the dataplanes by the backend that issued their
                certificate.
              type: object
            supportedBackends:
              additionalProperties:
                description: MeshInsight_DataplaneStat defines statistics specifically
                  for Dataplanes.
                properties:
                  offline:
                    description: Offline counts the dataplanes that are not connected.
                    type: integer
                  online:
                    description: Online counts the dataplanes that are connected.
                    type: integer
                  partiallyDegraded:
                    description: PartiallyDegraded counts the dataplanes with some
                      inbounds offline.
                    type: integer
                  total:
                    type: integer
                type: object
              description: |-
                SupportedBackends groups the dataplanes by the backends they accept
                certificates from.
              type: object
          type: object
        resources:
          additionalProperties:
            description: MeshInsight_ResourceStat counts the stored resources of a
              single type.
            properties:
              total:
                type: integer
            type: object
          description: Resources counts the stored resources of the mesh by type.
          type: object
      type: object
