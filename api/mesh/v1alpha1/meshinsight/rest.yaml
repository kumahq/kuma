openapi: 3.1.0
info:
  version: v1alpha1
  title: Kuma API
  description: Kuma API
  x-ref-schema-name: "MeshInsight"

paths:
  /mesh-insights/{name}:
    get:
      operationId: getMeshInsight
      summary: Get the insight of a mesh
      description: Returns the observed state of a mesh, computed by the control plane. Read only.
      responses:
        '200':
          $ref: '#/components/responses/GetMeshInsightResponse'
        '400':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/BadRequest'
        '404':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/NotFound'
        '500':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/Internal'
      parameters:
        - in: path
          name: name
          required: true
          description: The name of the mesh to get the insight for.
          schema:
            type: string
  /mesh-insights:
    get:
      operationId: getMeshInsightList
      summary: List mesh insights
      description: Returns the observed state of every mesh, computed by the control plane. Read only.
      parameters:
        - in: query
          name: size
          required: false
          description: Size of the page.
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          description: Offset of the page to list.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetMeshInsightListResponse'
        '400':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/BadRequest'
        '500':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/Internal'

components:
  schemas:
    MeshInsightWithMeta:
      allOf:
        # MeshInsight is a global resource without a short name, so the shared Meta
        # does not fit: it never has a mesh or a kri, and labels are only present
        # when the store computes them (e.g. kuma.io/display-name on Kubernetes).
        - type: object
          required: [type, name]
          properties:
            type:
              type: string
              example: MeshInsight
              description: the type of this resource
            name:
              type: string
              example: default
              description: the name of the mesh this insight is computed for
            labels:
              type: object
              additionalProperties:
                type: string
              description: Labels computed by the control plane, if any.
            creationTime:
              type: string
              format: date-time
              readOnly: true
              description: Time at which the resource was created
            modificationTime:
              type: string
              format: date-time
              readOnly: true
              description: Time at which the resource was updated
        - $ref: '/specs/protoresources/meshinsight/schema.yaml#/components/schemas/MeshInsight'

  responses:
    GetMeshInsightResponse:
      description: A response containing the insight of a mesh.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MeshInsightWithMeta'
    GetMeshInsightListResponse:
      description: A response containing a list of mesh insights.
      content:
        application/json:
          schema:
            type: object
            required: [total, items, next]
            properties:
              total:
                type: integer
                example: 200
              next:
                type:
                  - string
                  - 'null'
                description: URL to the next page, or null when this is the last page
              items:
                type: array
                items:
                  $ref: '#/components/schemas/MeshInsightWithMeta'
