syntax = "proto3";

// The messages here are the KDS wire form of specs that api/mesh/v1alpha1 now
// defines as plain Go structs. A control plane of any released version decodes
// the KDS `Any` of these types by its type URL and then as protobuf, so the
// wire form has to keep both. Only the full names below are load bearing,
// which is why the proto package stays kuma.mesh.v1alpha1 while the Go package
// does not: two Go types cannot share one name in one package.
//
// Frozen. Do not add, renumber or retype a field: a peer on the other side of
// the upgrade parses these bytes with the definition it shipped with.
package kuma.mesh.v1alpha1;

option go_package = "github.com/kumahq/kuma/v3/api/mesh/v1alpha1/kdswire";

message Mesh {
  reserved 1 to 7, 9;

  repeated string skipCreatingInitialPolicies = 8;
}
