syntax = "proto3";

// The messages here are the KDS wire form of specs that api/mesh/v1alpha1 now
// defines as plain Go structs. A control plane of any released version decodes
// the KDS `Any` of these types by its type URL and then as protobuf, so the
// wire form has to keep both. Only the full names below are load bearing,
// which is why the proto package stays kuma.mesh.v1alpha1 while the Go package
// does not: two Go types cannot share one name in one package.
//
// Frozen. Do not add, renumber or retype a field: a peer on the other side of
// the upgrade parses these bytes with the definition it shipped with.
package kuma.mesh.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/kumahq/kuma/v3/api/mesh/v1alpha1/kdswire";

message EnvoyAdmin {
  // Port on which Envoy Admin API server will be listening
  uint32 port = 1;
}

// Dataplane defines a configuration of a side-car proxy.
message Dataplane {
  // Networking describes inbound and outbound interfaces of a data plane proxy.
  message Networking {
    // IP on which the data plane proxy is accessible to the control plane and
    // other data plane proxies in the same network. This can also be a
    // hostname, in which case the control plane will periodically resolve it.
    string address = 5;

    reserved 6; // Formerly ingress mode message, see #3435

    reserved 7; // Formerly advertisedAddress, see #15629

    // Inbound describes a service implemented by the data plane proxy.
    // All incoming traffic to a data plane proxy are going through inbound
    // listeners. For every defined Inbound there is a corresponding Envoy
    // Listener.
    message Inbound {
      // Port of the inbound interface that will forward requests to the
      // service.
      //
      // When transparent proxying is used, it is a port on which the service is
      // listening to. When transparent proxying is not used, Envoy will bind to
      // this port.
      uint32 port = 3;

      // Port of the service that requests will be forwarded to.
      // Defaults to the same value as `port`.
      uint32 servicePort = 4;

      // Address of the service that requests will be forwarded to.
      // Defaults to 'inbound.address', since Kuma DP should be deployed next
      // to the service.
      string serviceAddress = 6;

      // Address on which inbound listener will be exposed.
      // Defaults to `networking.address`.
      string address = 5;

      reserved 2;
      reserved "tags";

      // Health describes the status of an inbound
      message Health {
        // Ready indicates if the data plane proxy is ready to serve the
        // traffic.
        bool ready = 1;
      }

      // Health describes the status of an inbound.
      // If 'health' is nil we consider data plane proxy as healthy.
      // Unhealthy data plane proxies are excluded from Endpoints Discovery
      // Service (EDS). On Kubernetes, it is filled automatically by the control
      // plane if Pod has readiness probe configured. On Universal, it can be
      // set by the external health checking system, but the most common way is
      // to use service probes.
      //
      // See https://kuma.io/docs/latest/documentation/health for more
      // information.
      Health health = 7;

      // ServiceProbe defines parameters for probing service's port
      message ServiceProbe {
        // Interval between consecutive health checks.
        google.protobuf.Duration interval = 1;

        // Maximum time to wait for a health check response.
        google.protobuf.Duration timeout = 2;

        // Number of consecutive unhealthy checks before considering a host
        // unhealthy.
        google.protobuf.UInt32Value unhealthy_threshold = 3;

        // Number of consecutive healthy checks before considering a host
        // healthy.
        google.protobuf.UInt32Value healthy_threshold = 4;

        message Tcp {}
        // Tcp checker tries to establish tcp connection with destination
        Tcp tcp = 5;
      }

      // ServiceProbe defines parameters for probing the service next to
      // sidecar. When service probe is defined, Envoy will periodically health
      // check the application next to it and report the status to the control
      // plane. On Kubernetes, Kuma deployments rely on Kubernetes probes so
      // this is not used.
      //
      // See https://kuma.io/docs/latest/documentation/health for more
      // information.
      ServiceProbe serviceProbe = 8;

      enum State {
        // Inbound is ready to serve the traffic.
        Ready = 0;
        // Inbound is not ready to serve the traffic.
        NotReady = 1;
        // Inbound is not created. It cannot be targeted by policies.
        // However, a data plane proxy receives a certificate with identity of
        // this inbound.
        Ignored = 2;
      }

      // State describes the current state of the listener.
      State state = 9;

      // Name adds another way of referencing this port, usable with MeshService
      string name = 10;

      // Protocol of the service (tcp, http, grpc, etc).
      string protocol = 11;
    }

    // Outbound describes a service consumed by the data plane proxy.
    // For every defined Outbound there is a corresponding Envoy Listener.
    message Outbound {
      // IP on which the consumed service will be available to this data plane
      // proxy. On Kubernetes, it's usually ClusterIP of a Service or PodIP of a
      // Headless Service. Defaults to 127.0.0.1
      string address = 3;

      // Port on which the consumed service will be available to this data plane
      // proxy. When transparent proxying is not used, Envoy will bind to this
      // port.
      uint32 port = 4;

      reserved 5;
      reserved "tags"; // Formerly tag-based outbounds, see #17808

      // BackendRef is a way to target MeshService.
      BackendRef backendRef = 6;

      message BackendRef {
        // Kind is a type of the object to target. Allowed: MeshService
        string kind = 1;
        // Name of the targeted object
        string name = 2;
        // Port of the targeted object. Required when kind is MeshService.
        uint32 port = 3;
        // Labels to select a single object.
        // If no object is selected then outbound is not created.
        // If multiple objects are selected then the oldest one is used.
        map<string, string> labels = 4;
      }
    }

    // TransparentProxying describes configuration for transparent proxying.
    message TransparentProxying {
      // `redirect_port_inbound` and `redirect_port_outbound` have been removed.
      // kuma-dp sends the redirect ports to the control plane in its metadata.
      reserved 1, 2;
      reserved "redirect_port_inbound", "redirect_port_outbound";

      // List of services that will be accessed directly via IP:PORT
      // Use `*` to indicate direct access to every service in the Mesh.
      // Using `*` to directly access every service is a resource-intensive
      // operation, use it only if needed.
      repeated string direct_access_services = 3;

      // `redirect_port_inbound_v6` has been removed since both IPv4 and IPv6
      // now use the same port for inbound redirection.
      reserved 4;
      reserved "redirect_port_inbound_v6";

      // `reachable_services` has been removed in favor of `reachable_backends`.
      reserved 5;
      reserved "reachable_services";

      // `ip_family_mode` has been removed. kuma-dp sends the IP family mode to
      // the control plane in its metadata.
      reserved 6;
      reserved "ip_family_mode";

      message ReachableBackendRef {
        // Type of the backend: MeshService, MeshExternalService or MeshMultiZoneService
        //  +required
        string kind = 1;
        // Name of the backend.
        //  +optional
        string name = 2;
        // Namespace of the backend. Might be empty
        //  +optional
        string namespace = 3;
        // Port of the backend.
        //  +optional
        google.protobuf.UInt32Value port = 4;
        // Labels used to select backends
        //  +optional
        map<string, string> labels = 5;
      }

      message ReachableBackends {
        repeated ReachableBackendRef refs = 1;
      }
      // Reachable backend via transparent proxy when running with
      // MeshExternalService, MeshService and MeshMultiZoneService. Setting an
      // explicit list of refs can dramatically improve the performance of the
      // mesh. If not specified, all services in the mesh are reachable.
      ReachableBackends reachable_backends = 7;
    }

    // `gateway = 3` was removed: a delegated gateway is marked by the
    // `kuma.io/gateway` label on the Dataplane. The ordinal stays reserved so
    // it is never reused.
    reserved 3;
    reserved "gateway";

    // Inbound describes a list of inbound interfaces of the data plane proxy.
    //
    // Inbound describes a service implemented by the data plane proxy.
    // All incoming traffic to a data plane proxy is going through inbound
    // listeners. For every defined Inbound there is a corresponding Envoy
    // Listener.
    repeated Inbound inbound = 1;

    // Outbound describes a list of services consumed by the data plane proxy.
    // For every defined Outbound, there is a corresponding Envoy Listener.
    repeated Outbound outbound = 2;

    // TransparentProxying describes the configuration for transparent proxying.
    // It is used by default on Kubernetes.
    TransparentProxying transparent_proxying = 4;

    // Admin describes configuration related to Envoy Admin API.
    // Due to security, all the Envoy Admin endpoints are exposed only on
    // localhost. Additionally, Envoy will expose `/ready` endpoint on
    // `networking.address` for health checking systems to be able to check the
    // state of Envoy. The rest of the endpoints exposed on `networking.address`
    // are always protected by mTLS and only meant to be consumed internally by
    // the control plane.
    EnvoyAdmin admin = 8;

    // Listener describes a zone proxy listener (ZoneIngress or ZoneEgress)
    // embedded in a regular Dataplane.
    message Listener {
      enum Type {
        // Unspecified is the default protobuf zero value. A Listener must
        // explicitly set either ZoneIngress or ZoneEgress; resources without
        // an explicit type will have this value omitted in JSON output.
        Unspecified = 0;
        // ZoneIngress configures this listener to act as a zone ingress,
        // accepting cross-zone traffic destined for services in this zone.
        ZoneIngress = 1;
        // ZoneEgress configures this listener to act as a zone egress,
        // forwarding outbound traffic to external services.
        ZoneEgress = 2;
      }

      enum State {
        // Listener is ready to serve traffic.
        Ready = 0;
        // Listener is not ready to serve traffic.
        NotReady = 1;
      }

      // Type determines the role of this listener: ZoneIngress for inbound
      // cross-zone traffic or ZoneEgress for outbound external traffic.
      Type type = 1;

      // Address on which the listener will be exposed.
      string address = 2;

      // Port on which the listener will be exposed.
      uint32 port = 3;

      // Name uniquely identifies this listener within the Dataplane and is
      // used to reference it via sectionName in policies.
      // Optional: if unset, the port value is used as the name (as a string).
      string name = 4;

      // State describes the current health state of the listener.
      // The control plane sets this based on the readiness of the underlying
      // pod and sidecar container.
      State state = 5;
    }

    // Listeners describes zone proxy listeners embedded in this Dataplane.
    // Listeners may coexist with inbounds and gateways.
    repeated Listener listeners = 9;
  }

  // Networking describes inbound and outbound interfaces of the data plane
  // proxy.
  Networking networking = 1;

  reserved 2;
  reserved "metrics";

  reserved 3;
  reserved "probes";
}

// DataplaneInsight defines the observed state of a Dataplane.
message DataplaneInsight {
  // List of ADS subscriptions created by a given Dataplane.
  repeated DiscoverySubscription subscriptions = 1;

  // Insights about mTLS for Dataplane.
  MTLS mTLS = 2;

  // MTLS defines insights for mTLS
  message MTLS {
    // Expiration time of the last certificate that was generated for a
    // Dataplane.
    google.protobuf.Timestamp certificate_expiration_time = 1;

    // Time on which the last certificate was generated.
    google.protobuf.Timestamp last_certificate_regeneration = 2;

    // Number of certificate regenerations for a Dataplane.
    uint32 certificate_regenerations = 3;

    // Backend that was used to generate current certificate
    string issuedBackend = 4;

    // Supported backends (CA).
    repeated string supportedBackends = 5;
  }

  google.protobuf.Struct metadata = 3;

  // Insights about OTel runtime resolution for this Dataplane.
  OpenTelemetry openTelemetry = 4;

  message OpenTelemetry {
    repeated Backend backends = 1;

    message Backend {
      string name = 1;
      Signal traces = 2;
      Signal logs = 3;
      Signal metrics = 4;
    }

    message Signal {
      bool enabled = 1;
      bool envAllowed = 2;
      bool envInputPresent = 3;
      string state = 4;
      repeated string overrideKinds = 5;
      repeated string missingFields = 6;
      repeated string blockedReasons = 7;
    }
  }
}

// DiscoverySubscription describes a single ADS subscription
// created by a Dataplane to the Control Plane.
// Ideally, there should be only one such subscription per Dataplane lifecycle.
// Presence of multiple subscriptions might indicate one of the following
// events:
// - transient loss of network connection between Dataplane and Control Plane
// - Dataplane restart (i.e. hot restart or crash)
// - Control Plane restart (i.e. rolling update or crash)
// - etc
message DiscoverySubscription {
  // Unique id per ADS subscription.
  string id = 1;

  // Control Plane instance that handled given subscription.
  string control_plane_instance_id = 2;

  // Time when a given Dataplane connected to the Control Plane.
  google.protobuf.Timestamp connect_time = 3;

  // Time when a given Dataplane disconnected from the Control Plane.
  google.protobuf.Timestamp disconnect_time = 4;

  // Status of the ADS subscription.
  DiscoverySubscriptionStatus status = 5;

  // Version of Envoy and Kuma dataplane
  Version version = 6;

  // Generation is an integer number which is periodically increased by the
  // status sink
  uint32 generation = 7;
}

// DiscoverySubscriptionStatus defines status of an ADS subscription.
message DiscoverySubscriptionStatus {
  // Time when status of a given ADS subscription was most recently updated.
  google.protobuf.Timestamp last_update_time = 1;

  // Total defines an aggregate over individual xDS stats.
  DiscoveryServiceStats total = 2;

  // CDS defines all CDS stats.
  DiscoveryServiceStats cds = 3;

  // EDS defines all EDS stats.
  DiscoveryServiceStats eds = 4;

  // LDS defines all LDS stats.
  DiscoveryServiceStats lds = 5;

  // RDS defines all RDS stats.
  DiscoveryServiceStats rds = 6;
}

// DiscoveryServiceStats defines all stats over a single xDS service.
message DiscoveryServiceStats {
  // Number of xDS responses sent to the Dataplane.
  uint64 responses_sent = 1;

  // Number of xDS responses ACKed by the Dataplane.
  uint64 responses_acknowledged = 2;

  // Number of xDS responses NACKed by the Dataplane.
  uint64 responses_rejected = 3;
}

// Version defines version of Kuma Dataplane and Envoy
message Version {
  // Version of Kuma Dataplane
  KumaDpVersion kumaDp = 1;

  // Version of Envoy
  EnvoyVersion envoy = 2;

  // Versions of other dependencies
  map<string, string> dependencies = 3;
}

// KumaDpVersion describes details of Kuma Dataplane version
message KumaDpVersion {
  // Version number of Kuma Dataplane
  string version = 1;

  // Git tag of Kuma Dataplane version
  string gitTag = 2;

  // Git commit of Kuma Dataplane version
  string gitCommit = 3;

  // Build date of Kuma Dataplane version
  string buildDate = 4;

  // True iff Kuma DP version is compatible with Kuma CP version
  bool kumaCpCompatible = 5;
}

// EnvoyVersion describes details of Envoy version
message EnvoyVersion {
  // Version number of Envoy
  string version = 1;

  // Full build tag of Envoy version
  string build = 2;

  // True iff Envoy version is compatible with Kuma DP version
  bool kumaDpCompatible = 3;
}
