openapi: 3.1.0
info:
  version: v1alpha1
  title: Kuma API
  description: Kuma API
  x-ref-schema-name: "ZoneOverview"

paths:
  /zones/{name}/_overview:
    get:
      operationId: getZoneOverview
      parameters:
        - in: path
          name: name
          required: true
          description: The name of the zone to get the overview for.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetZoneOverviewResponse'
        '400':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/BadRequest'
        '500':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/Internal'
  /zones/_overview:
    get:
      operationId: getZoneOverviewList
      responses:
        '200':
          $ref: '#/components/responses/GetZoneOverviewListResponse'
        '400':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/BadRequest'
        '500':
          $ref: '/specs/base/specs/common/error_schema.yaml#/components/responses/Internal'

components:
  schemas:
    ZoneOverviewWithMeta:
      allOf:
        # ZoneOverview is a global resource, so the shared Meta does not fit: it
        # never has a mesh, and labels are only present when the store computes
        # them (e.g. kuma.io/display-name on Kubernetes). Its base (Zone) has a
        # short name, so the response does carry a kri.
        - type: object
          required: [type, name]
          properties:
            type:
              type: string
              example: ZoneOverview
              description: the type of this resource
            name:
              type: string
              example: zone-1
              description: the name of the zone this overview describes
            kri:
              type: string
              readOnly: true
              description: Kuma Resource Identifier (KRI) of the given resource
            labels:
              type: object
              additionalProperties:
                type: string
              description: Labels computed by the control plane, if any.
            creationTime:
              type: string
              format: date-time
              readOnly: true
              description: Time at which the resource was created
            modificationTime:
              type: string
              format: date-time
              readOnly: true
              description: Time at which the resource was updated
        - $ref: '/specs/protoresources/zoneoverview/schema.yaml#/components/schemas/ZoneOverview'

  responses:
    GetZoneOverviewResponse:
      description: A response containing the overview of a zone.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ZoneOverviewWithMeta'
    GetZoneOverviewListResponse:
      description: A response containing a list of zone overviews.
      content:
        application/json:
          schema:
            type: object
            required: [total, items, next]
            properties:
              total:
                type: integer
                example: 200
              next:
                type:
                  - string
                  - 'null'
                description: URL to the next page, or null when this is the last page
              items:
                type: array
                items:
                  $ref: '#/components/schemas/ZoneOverviewWithMeta'
