match:
  type: HostnameGenerator
  port: 8080
  protocol: http
endpoints:
  - address: 1.1.1.1
    port: 12345
  - address: example.com
    port: 80
tls:
  version:
    min: TLS12
    max: TLS13
  allowRenegotiation: false
  verification:
    serverName: "example.com"
    subjectAltNames:
      - type: Exact
        value: example.com
      - type: Prefix
        value: "spiffe://example.local/ns/local"
    caCert:
      type: InsecureInline
      insecureInline:
        value: test
    clientCert:
      type: Secret
      secretRef:
        kind: Secret
        name: "123"
    clientKey:
      type: Secret
      secretRef:
        kind: Secret
        name: "123"
