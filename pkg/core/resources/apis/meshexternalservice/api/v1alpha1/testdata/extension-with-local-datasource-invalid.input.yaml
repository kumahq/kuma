match:
  type: HostnameGenerator
  port: 80
  protocol: http
extension:
  type: example
tls:
  enabled: true
  verification:
    caCert:
      type: File
      file:
        path: /var/run/secrets/token
    clientCert:
      type: EnvVar
      envVar:
        name: KUMA_GENERAL_TLS_KEY_FILE
    clientKey:
      type: InsecureInline
      insecureInline:
        value: key
