---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: zoneinsights.kuma.io
spec:
  group: kuma.io
  names:
    categories:
    - kuma
    kind: ZoneInsight
    listKind: ZoneInsightList
    plural: zoneinsights
    singular: zoneinsight
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZoneInsight defines the observed state of a Zone Kuma CP.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the specification of the Kuma ZoneInsight resource.
            properties:
              envoyAdminStreams:
                description: Statistics about Envoy Admin Streams, superseded by KDSStreams.
                properties:
                  clustersGlobalInstanceId:
                    description: Global instance ID that handles Clusters streams.
                    type: string
                  configDumpGlobalInstanceId:
                    description: Global instance ID that handles XDS Config Dump streams.
                    type: string
                  statsGlobalInstanceId:
                    description: Global instance ID that handles Stats streams.
                    type: string
                type: object
              healthCheck:
                description: Information about the last received zone health check.
                properties:
                  time:
                    description: Time last health check received.
                    format: date-time
                    type: string
                type: object
              kdsStreams:
                description: Information about kds streams that are established between
                  global and zone.
                properties:
                  clusters:
                    description: Details of stream that handles Clusters stream.
                    properties:
                      connectTime:
                        description: Time when the stream was open.
                        format: date-time
                        type: string
                      globalInstanceId:
                        description: Global instance ID that handles the stream.
                        type: string
                    type: object
                  configDump:
                    description: Details of stream that handles XDS Config Dump stream.
                    properties:
                      connectTime:
                        description: Time when the stream was open.
                        format: date-time
                        type: string
                      globalInstanceId:
                        description: Global instance ID that handles the stream.
                        type: string
                    type: object
                  globalToZone:
                    description: Details of stream that handles global to zone resource
                      sync stream.
                    properties:
                      connectTime:
                        description: Time when the stream was open.
                        format: date-time
                        type: string
                      globalInstanceId:
                        description: Global instance ID that handles the stream.
                        type: string
                    type: object
                  stats:
                    description: Details of stream that handles Stats stream.
                    properties:
                      connectTime:
                        description: Time when the stream was open.
                        format: date-time
                        type: string
                      globalInstanceId:
                        description: Global instance ID that handles the stream.
                        type: string
                    type: object
                  zoneToGlobal:
                    description: Details of stream that handles zone to global resource
                      sync stream.
                    properties:
                      connectTime:
                        description: Time when the stream was open.
                        format: date-time
                        type: string
                      globalInstanceId:
                        description: Global instance ID that handles the stream.
                        type: string
                    type: object
                type: object
              subscriptions:
                description: List of KDS subscriptions created by a given Zone Kuma
                  CP.
                items:
                  description: |-
                    KDSSubscription describes a single KDS subscription created by a Zone to the Global.
                    Ideally there is one per Zone lifecycle. Several of them indicate a transient loss of
                    connectivity, or a restart of either control plane.
                  properties:
                    authTokenProvided:
                      description: Indicates if subscription provided auth token.
                      type: boolean
                    config:
                      description: Config of Zone Kuma CP.
                      type: string
                    connectTime:
                      description: Time when a given Zone connected to the Global.
                      format: date-time
                      type: string
                    disconnectTime:
                      description: Time when a given Zone disconnected from the Global.
                      format: date-time
                      type: string
                    generation:
                      description: Generation is an integer number which is periodically
                        increased by the status sink.
                      format: int32
                      type: integer
                    globalInstanceId:
                      description: Global CP instance that handled given subscription.
                      type: string
                    id:
                      description: Unique id per KDS subscription.
                      type: string
                    status:
                      description: Status of the KDS subscription.
                      properties:
                        lastUpdateTime:
                          description: Time when status of a given KDS subscription
                            was most recently updated.
                          format: date-time
                          type: string
                        stat:
                          additionalProperties:
                            description: |-
                              KDSServiceStats defines all stats over a single xDS service. The counters serialize
                              as JSON strings because protobuf writes 64 bit integers that way, and an older
                              control plane rejects them when written as numbers.
                            properties:
                              responsesAcknowledged:
                                description: Number of xDS responses ACKed by the
                                  Dataplane.
                                format: int64
                                type: integer
                              responsesRejected:
                                description: Number of xDS responses NACKed by the
                                  Dataplane.
                                format: int64
                                type: integer
                              responsesSent:
                                description: Number of xDS responses sent to the Dataplane.
                                format: int64
                                type: integer
                            type: object
                          description: Stat holds the KDS stats per resource type.
                          type: object
                        total:
                          description: Total defines an aggregate over individual
                            KDS stats.
                          properties:
                            responsesAcknowledged:
                              description: Number of xDS responses ACKed by the Dataplane.
                              format: int64
                              type: integer
                            responsesRejected:
                              description: Number of xDS responses NACKed by the Dataplane.
                              format: int64
                              type: integer
                            responsesSent:
                              description: Number of xDS responses sent to the Dataplane.
                              format: int64
                              type: integer
                          type: object
                      type: object
                    version:
                      description: Version of Zone Kuma CP.
                      properties:
                        kumaCp:
                          description: Version of Zone Kuma CP.
                          properties:
                            buildDate:
                              description: Build date of Kuma ControlPlane version.
                              type: string
                            gitCommit:
                              description: Git commit of Kuma ControlPlane version.
                              type: string
                            gitTag:
                              description: Git tag of Kuma ControlPlane version.
                              type: string
                            kumaCpGlobalCompatible:
                              description: True iff this Zone CP version is compatible
                                with Global CP.
                              type: boolean
                            version:
                              description: Version number of Kuma ControlPlane.
                              type: string
                          type: object
                      type: object
                    zoneInstanceId:
                      description: |-
                        Zone CP instance that handled the given subscription, the leader at the time of
                        connection.
                      type: string
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
