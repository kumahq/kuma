kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: zoneinsights.kuma.io
spec:
  group: kuma.io
  names:
    categories:
    - kuma
    kind: ZoneInsight
    listKind: ZoneInsightList
    plural: zoneinsights
    singular: zoneinsight
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ZoneInsight defines the observed state of a Zone Kuma CP.
          EnvoyAdminStreams is deprecated, KDSStreams replaces it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the specification of the Kuma ZoneInsight resource.
            properties:
              envoyAdminStreams:
                properties:
                  clustersGlobalInstanceId:
                    type: string
                  configDumpGlobalInstanceId:
                    type: string
                  statsGlobalInstanceId:
                    type: string
                type: object
              healthCheck:
                properties:
                  time:
                    format: date-time
                    type: string
                type: object
              kdsStreams:
                properties:
                  clusters:
                    properties:
                      connectTime:
                        format: date-time
                        type: string
                      globalInstanceId:
                        type: string
                    type: object
                  configDump:
                    properties:
                      connectTime:
                        format: date-time
                        type: string
                      globalInstanceId:
                        type: string
                    type: object
                  globalToZone:
                    properties:
                      connectTime:
                        format: date-time
                        type: string
                      globalInstanceId:
                        type: string
                    type: object
                  stats:
                    properties:
                      connectTime:
                        format: date-time
                        type: string
                      globalInstanceId:
                        type: string
                    type: object
                  zoneToGlobal:
                    properties:
                      connectTime:
                        format: date-time
                        type: string
                      globalInstanceId:
                        type: string
                    type: object
                type: object
              subscriptions:
                items:
                  description: |-
                    KDSSubscription describes a single KDS subscription created by a Zone to the Global.
                    Ideally there is one per Zone lifecycle. Several of them indicate a transient loss of
                    connectivity, or a restart of either control plane.
                    Generation is bumped by the status sink rather than by the connection itself, and
                    ZoneInstanceID names whichever Zone CP held leadership when the stream opened.
                  properties:
                    authTokenProvided:
                      type: boolean
                    config:
                      type: string
                    connectTime:
                      format: date-time
                      type: string
                    disconnectTime:
                      format: date-time
                      type: string
                    generation:
                      format: int32
                      type: integer
                    globalInstanceId:
                      type: string
                    id:
                      type: string
                    status:
                      properties:
                        lastUpdateTime:
                          format: date-time
                          type: string
                        stat:
                          additionalProperties:
                            description: |-
                              KDSServiceStats counters serialize as JSON strings because protobuf writes 64 bit
                              integers that way, and an older control plane rejects them when written as numbers.
                            properties:
                              responsesAcknowledged:
                                format: int64
                                type: integer
                              responsesRejected:
                                format: int64
                                type: integer
                              responsesSent:
                                format: int64
                                type: integer
                            type: object
                          type: object
                        total:
                          description: |-
                            KDSServiceStats counters serialize as JSON strings because protobuf writes 64 bit
                            integers that way, and an older control plane rejects them when written as numbers.
                          properties:
                            responsesAcknowledged:
                              format: int64
                              type: integer
                            responsesRejected:
                              format: int64
                              type: integer
                            responsesSent:
                              format: int64
                              type: integer
                          type: object
                      type: object
                    version:
                      properties:
                        kumaCp:
                          properties:
                            buildDate:
                              type: string
                            gitCommit:
                              type: string
                            gitTag:
                              type: string
                            kumaCpGlobalCompatible:
                              type: boolean
                            version:
                              type: string
                          type: object
                      type: object
                    zoneInstanceId:
                      type: string
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
