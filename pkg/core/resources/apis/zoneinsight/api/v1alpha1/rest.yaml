openapi: 3.1.0
info:
  version: v1alpha1
  title: Kuma API
  description: Kuma API
paths:
  /zone-insights/{name}:
    get:
      operationId: getZoneInsight
      summary: Returns ZoneInsight entity
      tags: ["ZoneInsight"]
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the ZoneInsight
      responses:
        '200':
          $ref: "#/components/responses/ZoneInsightItem"
        '404':
          $ref: "../../base/specs/common/error_schema.yaml#/components/responses/NotFound"
  /zone-insights:
    get:
      operationId: getZoneInsightList
      summary: Returns a list of ZoneInsight.
      tags: ["ZoneInsight"]
      parameters:
        - in: query
          name: offset
          description: offset in the list of entities
          required: false
          schema:
            type: integer
          example: 0
        - in: query
          name: size
          description: the number of items per page
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
            minimum: 1
        - in: query
          name: filter
          description: filter by labels when multiple filters are present, they are ANDed
          required: false
          schema:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
          example:
            label.k8s.kuma.io/namespace: my-ns
      responses:
        '200':
          $ref: "#/components/responses/ZoneInsightList"
components:
  schemas:
    ZoneInsightItem:
      type: object
      description: "ZoneInsight defines the observed state of a Zone Kuma CP.\nEnvoyAdminStreams is deprecated, KDSStreams replaces it."
      required: [type, name]
      properties:
        type:
          description: 'the type of the resource'
          type: string
          enum:
            - ZoneInsight
        name:
          description: 'Name of the Kuma resource'
          type: string
          # keep in sync with core_mesh.NamePattern / MaxNameLength
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
          maxLength: 253
        labels:
          additionalProperties:
            type: string
          description: 'The labels to help identity resources'
          type: object
        creationTime:
          readOnly: true
          type: string
          description: 'Time at which the resource was created'
          format: date-time
          example: '1901-01-01T00:00:00.000Z'
        modificationTime:
          readOnly: true
          type: string
          description: 'Time at which the resource was updated'
          format: date-time
          example: '1901-01-01T00:00:00.000Z'
        envoyAdminStreams:
          properties:
            clustersGlobalInstanceId:
              type: string
            configDumpGlobalInstanceId:
              type: string
            statsGlobalInstanceId:
              type: string
          type: object
        healthCheck:
          properties:
            time:
              format: date-time
              type: string
          type: object
        kdsStreams:
          properties:
            clusters:
              properties:
                connectTime:
                  format: date-time
                  type: string
                globalInstanceId:
                  type: string
              type: object
            configDump:
              properties:
                connectTime:
                  format: date-time
                  type: string
                globalInstanceId:
                  type: string
              type: object
            globalToZone:
              properties:
                connectTime:
                  format: date-time
                  type: string
                globalInstanceId:
                  type: string
              type: object
            stats:
              properties:
                connectTime:
                  format: date-time
                  type: string
                globalInstanceId:
                  type: string
              type: object
            zoneToGlobal:
              properties:
                connectTime:
                  format: date-time
                  type: string
                globalInstanceId:
                  type: string
              type: object
          type: object
        subscriptions:
          items:
            description: |-
              KDSSubscription describes a single KDS subscription created by a Zone to the Global.
              Ideally there is one per Zone lifecycle. Several of them indicate a transient loss of
              connectivity, or a restart of either control plane.
              Generation is bumped by the status sink rather than by the connection itself, and
              ZoneInstanceID names whichever Zone CP held leadership when the stream opened.
            properties:
              authTokenProvided:
                type: boolean
              config:
                type: string
              connectTime:
                format: date-time
                type: string
              disconnectTime:
                format: date-time
                type: string
              generation:
                format: int32
                type: integer
              globalInstanceId:
                type: string
              id:
                type: string
              status:
                properties:
                  lastUpdateTime:
                    format: date-time
                    type: string
                  stat:
                    additionalProperties:
                      description: |-
                        KDSServiceStats counters serialize as JSON strings because protobuf writes 64 bit
                        integers that way, and an older control plane rejects them when written as numbers.
                      properties:
                        responsesAcknowledged:
                          format: int64
                          type: integer
                        responsesRejected:
                          format: int64
                          type: integer
                        responsesSent:
                          format: int64
                          type: integer
                      type: object
                    type: object
                  total:
                    description: |-
                      KDSServiceStats counters serialize as JSON strings because protobuf writes 64 bit
                      integers that way, and an older control plane rejects them when written as numbers.
                    properties:
                      responsesAcknowledged:
                        format: int64
                        type: integer
                      responsesRejected:
                        format: int64
                        type: integer
                      responsesSent:
                        format: int64
                        type: integer
                    type: object
                type: object
              version:
                properties:
                  kumaCp:
                    properties:
                      buildDate:
                        type: string
                      gitCommit:
                        type: string
                      gitTag:
                        type: string
                      kumaCpGlobalCompatible:
                        type: boolean
                      version:
                        type: string
                    type: object
                type: object
              zoneInstanceId:
                type: string
            type: object
          type: array
  responses:
    ZoneInsightItem:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ZoneInsightItem'
    ZoneInsightList:
      description: List
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneInsightItem"
              total:
                type: number
                description: The total number of entities
              next:
                type: string
                description: URL to the next page
    ZoneInsightCreateOrUpdateSuccessResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              warnings:
                type: array
                readOnly: true
                description: |
                  warnings is a list of warning messages to return to the requesting Kuma API clients.
                  Warning messages describe a problem the client making the API request should correct or be aware of.
                items:
                  type: string
    ZoneInsightDeleteSuccessResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
