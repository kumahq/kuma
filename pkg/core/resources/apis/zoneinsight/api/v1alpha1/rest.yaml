openapi: 3.1.0
info:
  version: v1alpha1
  title: Kuma API
  description: Kuma API
paths:
  /zone-insights/{name}:
    get:
      operationId: getZoneInsight
      summary: Returns ZoneInsight entity
      tags: ["ZoneInsight"]
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the ZoneInsight
      responses:
        '200':
          $ref: "#/components/responses/ZoneInsightItem"
        '404':
          $ref: "../../base/specs/common/error_schema.yaml#/components/responses/NotFound"
  /zone-insights:
    get:
      operationId: getZoneInsightList
      summary: Returns a list of ZoneInsight.
      tags: ["ZoneInsight"]
      parameters:
        - in: query
          name: offset
          description: offset in the list of entities
          required: false
          schema:
            type: integer
          example: 0
        - in: query
          name: size
          description: the number of items per page
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
            minimum: 1
        - in: query
          name: filter
          description: filter by labels when multiple filters are present, they are ANDed
          required: false
          schema:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
          example:
            label.k8s.kuma.io/namespace: my-ns
      responses:
        '200':
          $ref: "#/components/responses/ZoneInsightList"
components:
  schemas:
    ZoneInsightItem:
      type: object
      description: "ZoneInsight defines the observed state of a Zone Kuma CP."
      required: [type, name]
      properties:
        type:
          description: 'the type of the resource'
          type: string
          enum:
            - ZoneInsight
        name:
          description: 'Name of the Kuma resource'
          type: string
          # keep in sync with core_mesh.NamePattern / MaxNameLength
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
          maxLength: 253
        labels:
          additionalProperties:
            type: string
          description: 'The labels to help identity resources'
          type: object
        creationTime:
          readOnly: true
          type: string
          description: 'Time at which the resource was created'
          format: date-time
          example: '1901-01-01T00:00:00.000Z'
        modificationTime:
          readOnly: true
          type: string
          description: 'Time at which the resource was updated'
          format: date-time
          example: '1901-01-01T00:00:00.000Z'
        envoyAdminStreams:
          description: Statistics about Envoy Admin Streams, superseded by KDSStreams.
          properties:
            clustersGlobalInstanceId:
              description: Global instance ID that handles Clusters streams.
              type: string
            configDumpGlobalInstanceId:
              description: Global instance ID that handles XDS Config Dump streams.
              type: string
            statsGlobalInstanceId:
              description: Global instance ID that handles Stats streams.
              type: string
          type: object
        healthCheck:
          description: Information about the last received zone health check.
          properties:
            time:
              description: Time last health check received.
              format: date-time
              type: string
          type: object
        kdsStreams:
          description: Information about kds streams that are established between global and zone.
          properties:
            clusters:
              description: Details of stream that handles Clusters stream.
              properties:
                connectTime:
                  description: Time when the stream was open.
                  format: date-time
                  type: string
                globalInstanceId:
                  description: Global instance ID that handles the stream.
                  type: string
              type: object
            configDump:
              description: Details of stream that handles XDS Config Dump stream.
              properties:
                connectTime:
                  description: Time when the stream was open.
                  format: date-time
                  type: string
                globalInstanceId:
                  description: Global instance ID that handles the stream.
                  type: string
              type: object
            globalToZone:
              description: Details of stream that handles global to zone resource sync stream.
              properties:
                connectTime:
                  description: Time when the stream was open.
                  format: date-time
                  type: string
                globalInstanceId:
                  description: Global instance ID that handles the stream.
                  type: string
              type: object
            stats:
              description: Details of stream that handles Stats stream.
              properties:
                connectTime:
                  description: Time when the stream was open.
                  format: date-time
                  type: string
                globalInstanceId:
                  description: Global instance ID that handles the stream.
                  type: string
              type: object
            zoneToGlobal:
              description: Details of stream that handles zone to global resource sync stream.
              properties:
                connectTime:
                  description: Time when the stream was open.
                  format: date-time
                  type: string
                globalInstanceId:
                  description: Global instance ID that handles the stream.
                  type: string
              type: object
          type: object
        subscriptions:
          description: List of KDS subscriptions created by a given Zone Kuma CP.
          items:
            description: |-
              KDSSubscription describes a single KDS subscription created by a Zone to the Global.
              Ideally there is one per Zone lifecycle. Several of them indicate a transient loss of
              connectivity, or a restart of either control plane.
            properties:
              authTokenProvided:
                description: Indicates if subscription provided auth token.
                type: boolean
              config:
                description: Config of Zone Kuma CP.
                type: string
              connectTime:
                description: Time when a given Zone connected to the Global.
                format: date-time
                type: string
              disconnectTime:
                description: Time when a given Zone disconnected from the Global.
                format: date-time
                type: string
              generation:
                description: Generation is an integer number which is periodically increased by the status sink.
                format: int32
                type: integer
              globalInstanceId:
                description: Global CP instance that handled given subscription.
                type: string
              id:
                description: Unique id per KDS subscription.
                type: string
              status:
                description: Status of the KDS subscription.
                properties:
                  lastUpdateTime:
                    description: Time when status of a given KDS subscription was most recently updated.
                    format: date-time
                    type: string
                  stat:
                    additionalProperties:
                      description: |-
                        KDSServiceStats defines all stats over a single xDS service. The counters serialize
                        as JSON strings because protobuf writes 64 bit integers that way, and an older
                        control plane rejects them when written as numbers.
                      properties:
                        responsesAcknowledged:
                          description: Number of xDS responses ACKed by the Dataplane.
                          format: int64
                          type: string
                        responsesRejected:
                          description: Number of xDS responses NACKed by the Dataplane.
                          format: int64
                          type: string
                        responsesSent:
                          description: Number of xDS responses sent to the Dataplane.
                          format: int64
                          type: string
                      type: object
                    description: Stat holds the KDS stats per resource type.
                    type: object
                  total:
                    description: Total defines an aggregate over individual KDS stats.
                    properties:
                      responsesAcknowledged:
                        description: Number of xDS responses ACKed by the Dataplane.
                        format: int64
                        type: string
                      responsesRejected:
                        description: Number of xDS responses NACKed by the Dataplane.
                        format: int64
                        type: string
                      responsesSent:
                        description: Number of xDS responses sent to the Dataplane.
                        format: int64
                        type: string
                    type: object
                type: object
              version:
                description: Version of Zone Kuma CP.
                properties:
                  kumaCp:
                    description: Version of Zone Kuma CP.
                    properties:
                      buildDate:
                        description: Build date of Kuma ControlPlane version.
                        type: string
                      gitCommit:
                        description: Git commit of Kuma ControlPlane version.
                        type: string
                      gitTag:
                        description: Git tag of Kuma ControlPlane version.
                        type: string
                      kumaCpGlobalCompatible:
                        description: True iff this Zone CP version is compatible with Global CP.
                        type: boolean
                      version:
                        description: Version number of Kuma ControlPlane.
                        type: string
                    type: object
                type: object
              zoneInstanceId:
                description: |-
                  Zone CP instance that handled the given subscription, the leader at the time of
                  connection.
                type: string
            type: object
          type: array
  responses:
    ZoneInsightItem:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ZoneInsightItem'
    ZoneInsightList:
      description: List
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneInsightItem"
              total:
                type: number
                description: The total number of entities
              next:
                type: string
                description: URL to the next page
    ZoneInsightCreateOrUpdateSuccessResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              warnings:
                type: array
                readOnly: true
                description: |
                  warnings is a list of warning messages to return to the requesting Kuma API clients.
                  Warning messages describe a problem the client making the API request should correct or be aware of.
                items:
                  type: string
    ZoneInsightDeleteSuccessResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
