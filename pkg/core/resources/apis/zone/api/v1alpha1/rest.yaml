openapi: 3.1.0
info:
  version: v1alpha1
  title: Kuma API
  description: Kuma API
paths:
  /zones/{name}:
    get:
      operationId: getZone
      summary: Returns Zone entity
      tags: ["Zone"]
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the Zone
      responses:
        '200':
          $ref: "#/components/responses/ZoneItem"
        '404':
          $ref: "../../base/specs/common/error_schema.yaml#/components/responses/NotFound"
    put:
      operationId: putZone
      summary: Creates or Updates Zone entity
      tags: ["Zone"]
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the Zone
      requestBody:
        description: Put request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneItem'
      responses:
        '200':
          $ref: '#/components/responses/ZoneCreateOrUpdateSuccessResponse'
        '201':
          $ref: '#/components/responses/ZoneCreateOrUpdateSuccessResponse'
    delete:
      operationId: deleteZone
      summary: Deletes Zone entity
      tags: ["Zone"]
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the Zone
      responses:
        '200':
          $ref: '#/components/responses/ZoneDeleteSuccessResponse'
        '404':
          $ref: "../../base/specs/common/error_schema.yaml#/components/responses/NotFound"
  /zones:
    get:
      operationId: getZoneList
      summary: Returns a list of Zone.
      tags: ["Zone"]
      parameters:
        - in: query
          name: offset
          description: offset in the list of entities
          required: false
          schema:
            type: integer
          example: 0
        - in: query
          name: size
          description: the number of items per page
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
            minimum: 1
        - in: query
          name: filter
          description: filter by labels when multiple filters are present, they are ANDed
          required: false
          schema:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
          example:
            label.k8s.kuma.io/namespace: my-ns
      responses:
        '200':
          $ref: "#/components/responses/ZoneList"
components:
  schemas:
    ZoneItem:
      type: object
      description: "Zone defines the Zone configuration used at the Global Control Plane within a\ndistributed deployment. Enabled is a pointer because an unset value and an explicit\nfalse mean different things: protobuf omitted an unset wrapper entirely, and an older\ncontrol plane still distinguishes the two."
      required: [type, name]
      properties:
        type:
          description: 'the type of the resource'
          type: string
          enum:
            - Zone
        kri:
          description: 'A unique identifier for this resource instance used by internal tooling and integrations. Typically derived from resource attributes and may be used for cross-references or indexing'
          type: string
          readOnly: true
          example: 'kri_z___kuma-demo_myresource1_'
        name:
          description: 'Name of the Kuma resource'
          type: string
          # keep in sync with core_mesh.NamePattern / MaxNameLength
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
          maxLength: 253
        labels:
          additionalProperties:
            type: string
          description: 'The labels to help identity resources'
          type: object
        creationTime:
          readOnly: true
          type: string
          description: 'Time at which the resource was created'
          format: date-time
          example: '1901-01-01T00:00:00.000Z'
        modificationTime:
          readOnly: true
          type: string
          description: 'Time at which the resource was updated'
          format: date-time
          example: '1901-01-01T00:00:00.000Z'
        spec:
          description: Spec is the specification of the Kuma Zone resource.
          x-kubernetes-preserve-unknown-fields: true
  responses:
    ZoneItem:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ZoneItem'
    ZoneList:
      description: List
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneItem"
              total:
                type: number
                description: The total number of entities
              next:
                type: string
                description: URL to the next page
    ZoneCreateOrUpdateSuccessResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              warnings:
                type: array
                readOnly: true
                description: |
                  warnings is a list of warning messages to return to the requesting Kuma API clients.
                  Warning messages describe a problem the client making the API request should correct or be aware of.
                items:
                  type: string
    ZoneDeleteSuccessResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
