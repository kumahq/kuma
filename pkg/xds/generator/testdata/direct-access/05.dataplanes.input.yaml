---
type: Dataplane
name: web-1
mesh: default
labels:
  kuma.io/service: web
networking:
  address: 192.168.0.1
  inbound:
    - port: 1234
  transparentProxying:
    redirectPort: 15001
    directAccessServices: ["backend"]
---
# legacy dataplane, provisioned before service identity moved to labels: it
# carries no kuma.io/service label and exposes two services on its inbounds
type: Dataplane
name: backend-1
mesh: default
networking:
  address: 192.168.0.2
  inbound:
    - port: 1234
      tags:
        kuma.io/service: backend
    - port: 1235
      tags:
        kuma.io/service: backend-api
---
type: Dataplane
name: backend-2
mesh: default
labels:
  kuma.io/service: backend
networking:
  address: 192.168.0.3
  inbound:
    - port: 1234
---
type: Dataplane
name: backend-api-1
mesh: default
labels:
  kuma.io/service: backend-api
networking:
  address: 192.168.0.5
  inbound:
    - port: 1234
