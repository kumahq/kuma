resources:
- name: self_inbound_dp_443
  resource:
    '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
    connectTimeout: 10s
    loadAssignment:
      clusterName: self_inbound_dp_443
      endpoints:
      - lbEndpoints:
        - endpoint:
            address:
              socketAddress:
                address: 192.168.0.2
                portValue: 8443
    name: self_inbound_dp_443
    type: STATIC
    upstreamBindConfig:
      sourceAddress:
        address: 127.0.0.6
        portValue: 0
- name: self_inbound_dp_80
  resource:
    '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
