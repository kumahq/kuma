#/meshes/default/dataplanes/dp-zone-proxy/_layout 200
type: Mesh
name: default
---
type: Dataplane
name: dp-zone-proxy
mesh: default
labels:
  kuma.io/zone: test-zone
  kuma.io/workload: zone-proxy
networking:
  address: 127.0.0.1
  listeners:
    - address: 127.0.0.1
      name: zi-main
      port: 10001
      type: ZoneIngress
    - address: 127.0.0.1
      port: 10002
      type: ZoneEgress
---
type: MeshService
name: local-server
mesh: default
labels:
  kuma.io/display-name: local-server
  kuma.io/origin: zone
  kuma.io/zone: test-zone
spec:
  selector:
    dataplaneTags:
      kuma.io/display-name: local-server
  ports:
    - port: 80
      targetPort: 80
      appProtocol: http
      name: main-port
    - port: 8080
      targetPort: 8080
      appProtocol: tcp
      name: secondary-port
status:
  vips:
    - ip: 240.0.0.1
---
type: MeshService
name: remote-server
mesh: default
labels:
  kuma.io/display-name: remote-server
  kuma.io/origin: global
  kuma.io/zone: other-zone
spec:
  selector:
    dataplaneTags:
      kuma.io/display-name: remote-server
  ports:
    - port: 80
      targetPort: 80
      appProtocol: http
      name: main-port
status:
  vips:
    - ip: 240.0.0.2
---
type: MeshMultiZoneService
name: multizone-server
mesh: default
spec:
  selector:
    meshService:
      matchLabels:
        kuma.io/display-name: local-server
  ports:
    - port: 80
      appProtocol: http
status:
  vips:
    - ip: 240.0.0.3
---
type: MeshExternalService
name: mes-1
mesh: default
spec:
  match:
    type: HostnameGenerator
    port: 9090
    protocol: http
  endpoints:
    - address: 127.0.0.1
      port: 8080
status:
  vip:
    ip: 242.0.0.4
---
type: MeshIdentity
name: identity-1
mesh: default
labels:
  kuma.io/zone: test-zone
spec:
  selector:
    dataplane:
      matchLabels:
        kuma.io/zone: test-zone
  provider:
    type: Bundled
    bundled:
      insecureAllowSelfSigned: true
      autogenerate:
        enabled: true
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Ready
      message: Successfully initialized
