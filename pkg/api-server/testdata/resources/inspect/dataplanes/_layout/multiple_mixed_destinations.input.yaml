#/meshes/default/dataplanes/dp-1/_layout 200
type: Mesh
name: default
---
type: Dataplane
name: dp-1
mesh: default
labels:
  kuma.io/zone: test-zone
networking:
  address: 127.0.0.1
  inbound:
    - port: 8080
      name: main-port
      protocol: http
      tags:
        kuma.io/display-name: foo
        kuma.io/protocol: http
    - port: 8081
      name: secondary-port
      protocol: tcp
      tags:
        kuma.io/display-name: foo
        kuma.io/protocol: tcp
  transparentProxying:
    redirectPortInbound: 15006
    redirectPortOutbound: 15001
---
type: MeshService
name: test-server-1
mesh: default
labels:
  kuma.io/display-name: test-server-1
  kuma.io/zone: test-zone
spec:
  selector:
    dataplaneTags:
      kuma.io/display-name: test-server
  ports:
    - port: 80
      targetPort: 80
      appProtocol: http
      name: main-port
    - port: 8080
      targetPort: 8080
      appProtocol: tcp
      name: secondary-port
status:
  vips:
    - ip: 240.0.0.1
---
type: MeshMultiZoneService
name: multizone-test-server
mesh: default
spec:
  selector:
    meshService:
      matchLabels:
        kuma.io/display-name: test-server
  ports:
    - port: 80
      appProtocol: http
status:
  vips:
    - ip: 240.0.0.2
---
type: MeshExternalService
name: mes-1
mesh: default
spec:
  match:
    type: HostnameGenerator
    port: 9090
    protocol: http
  endpoints:
    - address: 127.0.0.1
      port: 8080
status:
  vip:
    ip: 242.0.0.3
