#/meshes/default/meshservices/orders-service/_dataplanes 200
# Exclusive delta: the MeshService selector carries two dataplaneLabels
# (app + version). Only the dataplane matching BOTH labels is returned,
# exercising the exact label matching used by the inspect endpoint via
# meshservice.MatchesDataplane() against the shipping Exclusive default. The
# Disabled siblings in this directory only ever select on a single label.
type: Mesh
name: default
---
type: MeshService
name: orders-service
mesh: default
labels:
  kuma.io/origin: zone
  kuma.io/env: universal
spec:
  selector:
    dataplaneLabels:
      matchLabels:
        app: orders
        version: v2
  ports:
    - port: 80
      targetPort: 80
      appProtocol: http
      name: main-port
---
type: Dataplane
name: orders-v2-01
mesh: default
labels:
  app: orders
  version: v2
networking:
  address: 127.0.0.1
  inbound:
    - port: 80
      tags:
        kuma.io/display-name: orders_kuma-demo_svc_80
        app: orders
        version: v2
---
type: Dataplane
name: orders-v1-01
mesh: default
labels:
  app: orders
  version: v1
networking:
  address: 127.0.0.2
  inbound:
    - port: 80
      tags:
        kuma.io/display-name: orders_kuma-demo_svc_80
        app: orders
        version: v1
---
type: Dataplane
name: payments-v2-01
mesh: default
labels:
  app: payments
  version: v2
networking:
  address: 127.0.0.3
  inbound:
    - port: 80
      tags:
        kuma.io/display-name: payments_kuma-demo_svc_80
        app: payments
        version: v2
