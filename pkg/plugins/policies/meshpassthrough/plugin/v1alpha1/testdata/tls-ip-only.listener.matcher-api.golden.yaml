resources:
- name: outbound:passthrough:ipv4
  resource:
    '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    address:
      socketAddress:
        address: 0.0.0.0
        portValue: 15001
    filterChainMatcher:
      matcherTree:
        exactMatchMap:
          map:
            tls:
              matcher:
                onNoMatch:
                  matcher:
                    matcherList:
                      matchers:
                      - onMatch:
                          matcher:
                            matcherTree:
                              exactMatchMap:
                                map:
                                  "443":
                                    action:
                                      name: meshpassthrough_tls_10.0.0.1_443
                                      typedConfig:
                                        '@type': type.googleapis.com/google.protobuf.StringValue
                                        value: meshpassthrough_tls_10.0.0.1_443
                              input:
                                name: envoy.matching.inputs.destination_port
                                typedConfig:
                                  '@type': type.googleapis.com/envoy.extensions.matching.common_inputs.network.v3.DestinationPortInput
                        predicate:
                          singlePredicate:
                            customMatch:
                              name: envoy.matching.matchers.ip
                              typedConfig:
                                '@type': type.googleapis.com/envoy.extensions.matching.input_matchers.ip.v3.Ip
                                cidrRanges:
                                - addressPrefix: 10.0.0.1
                                  prefixLen: 32
                                statPrefix: 10.0.0.1
                            input:
                              name: envoy.matching.inputs.destination_ip
                              typedConfig:
                                '@type': type.googleapis.com/envoy.extensions.matching.common_inputs.network.v3.DestinationIPInput
                      - onMatch:
                          matcher:
                            matcherTree:
                              exactMatchMap:
                                map:
                                  "443":
                                    action:
                                      name: meshpassthrough_tls_192.168.0.0/16_443
                                      typedConfig:
                                        '@type': type.googleapis.com/google.protobuf.StringValue
                                        value: meshpassthrough_tls_192.168.0.0/16_443
                              input:
                                name: envoy.matching.inputs.destination_port
                                typedConfig:
                                  '@type': type.googleapis.com/envoy.extensions.matching.common_inputs.network.v3.DestinationPortInput
                        predicate:
                          singlePredicate:
                            customMatch:
                              name: envoy.matching.matchers.ip
                              typedConfig:
                                '@type': type.googleapis.com/envoy.extensions.matching.input_matchers.ip.v3.Ip
                                cidrRanges:
                                - addressPrefix: 192.168.0.0
                                  prefixLen: 16
                                statPrefix: 192.168.0.0/16
                            input:
                              name: envoy.matching.inputs.destination_ip
                              typedConfig:
                                '@type': type.googleapis.com/envoy.extensions.matching.common_inputs.network.v3.DestinationIPInput
        input:
          name: envoy.matching.inputs.transport_protocol
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.matching.common_inputs.network.v3.TransportProtocolInput
    filterChains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typedConfig:
          '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          cluster: meshpassthrough_tls_10.0.0.1_443
          statPrefix: meshpassthrough_tls_10_0_0_1_443
      name: meshpassthrough_tls_10.0.0.1_443
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typedConfig:
          '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          cluster: meshpassthrough_tls_192.168.0.0/16_443
          statPrefix: meshpassthrough_tls_192_168_0_0_16_443
      name: meshpassthrough_tls_192.168.0.0/16_443
    listenerFilters:
    - name: envoy.filters.listener.original_dst
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst
    - name: envoy.filters.listener.tls_inspector
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    - name: envoy.filters.listener.http_inspector
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.listener.http_inspector.v3.HttpInspector
    name: outbound:passthrough:ipv4
    trafficDirection: OUTBOUND
- name: outbound:passthrough:ipv6
  resource:
    '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    address:
      socketAddress:
        address: '::'
        portValue: 15001
    filterChains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typedConfig:
          '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          cluster: outbound:passthrough:ipv6
          statPrefix: outbound_passthrough_ipv6
    name: outbound:passthrough:ipv6
    trafficDirection: OUTBOUND
