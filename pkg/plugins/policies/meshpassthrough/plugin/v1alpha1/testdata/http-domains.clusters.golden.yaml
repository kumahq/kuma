resources:
- name: meshpassthrough_http_www.anotherexample.com_8080
  resource:
    '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
    altStatName: meshpassthrough_http_www_anotherexample_com_8080
    connectTimeout: 5s
    dnsLookupFamily: V4_ONLY
    loadAssignment:
      clusterName: meshpassthrough_http_www.anotherexample.com_8080
      endpoints:
      - lbEndpoints:
        - endpoint:
            address:
              socketAddress:
                address: www.anotherexample.com
                portValue: 8080
    name: meshpassthrough_http_www.anotherexample.com_8080
    type: STRICT_DNS
- name: meshpassthrough_http_www.example.com_80
  resource:
    '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
    altStatName: meshpassthrough_http_www_example_com_80
    connectTimeout: 5s
    dnsLookupFamily: V4_ONLY
    loadAssignment:
      clusterName: meshpassthrough_http_www.example.com_80
      endpoints:
      - lbEndpoints:
        - endpoint:
            address:
              socketAddress:
                address: www.example.com
                portValue: 80
    name: meshpassthrough_http_www.example.com_80
    type: STRICT_DNS
