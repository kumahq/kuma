openapi: 3.1.0
info:
  version: v1alpha1
  title: Kuma API
  description: Kuma API
paths:
  /meshes/{mesh}/meshtrafficpermissions/{name}:
    get:
      operationId: getMeshTrafficPermission
      summary: Returns MeshTrafficPermission entity
      tags: ["MeshTrafficPermission"]
      parameters:
        - in: path
          name: mesh
          schema:
            type: string
          required: true
          description: name of the mesh
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the MeshTrafficPermission
      responses:
        '200':
          $ref: "#/components/responses/MeshTrafficPermissionItem"
        '404':
          $ref: "../../base/specs/common/error_schema.yaml#/components/responses/NotFound"
    put:
      operationId: putMeshTrafficPermission
      summary: Creates or Updates MeshTrafficPermission entity
      tags: ["MeshTrafficPermission"]
      parameters:
        - in: path
          name: mesh
          schema:
            type: string
          required: true
          description: name of the mesh
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the MeshTrafficPermission
      requestBody:
        description: Put request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshTrafficPermissionItem'
      responses:
        '200':
          $ref: '#/components/responses/MeshTrafficPermissionCreateOrUpdateSuccessResponse'
        '201':
          $ref: '#/components/responses/MeshTrafficPermissionCreateOrUpdateSuccessResponse'
    delete:
      operationId: deleteMeshTrafficPermission
      summary: Deletes MeshTrafficPermission entity
      tags: ["MeshTrafficPermission"]
      parameters:
        - in: path
          name: mesh
          schema:
            type: string
          required: true
          description: name of the mesh
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the MeshTrafficPermission
      responses:
        '200':
          $ref: '#/components/responses/MeshTrafficPermissionDeleteSuccessResponse'
        '404':
          $ref: "../../base/specs/common/error_schema.yaml#/components/responses/NotFound"
  /meshes/{mesh}/meshtrafficpermissions:
    get:
      operationId: getMeshTrafficPermissionList
      summary: Returns a list of MeshTrafficPermission in the mesh.
      tags: ["MeshTrafficPermission"]
      parameters:
        - in: query
          name: offset
          description: offset in the list of entities
          required: false
          schema:
            type: integer
          example: 0
        - in: query
          name: size
          description: the number of items per page
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
            minimum: 1
        - in: query
          name: filter
          description: filter by labels when multiple filters are present, they are ANDed
          required: false
          schema:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
          example:
            label.k8s.kuma.io/namespace: my-ns
        - in: path
          name: mesh
          schema:
            type: string
          required: true
          description: name of the mesh
      responses:
        '200':
          $ref: "#/components/responses/MeshTrafficPermissionList"
  /meshtrafficpermissions:
    get:
      operationId: getMeshTrafficPermissionListAllMeshes
      summary: Returns a list of MeshTrafficPermission across all meshes.
      tags: ["MeshTrafficPermission"]
      parameters:
        - in: query
          name: offset
          description: offset in the list of entities
          required: false
          schema:
            type: integer
            example: 0
        - in: query
          name: size
          description: the number of items per page
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
            minimum: 1
        - in: query
          name: filter
          description: filter by labels when multiple filters are present, they are ANDed
          required: false
          schema:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
          example:
            label.k8s.kuma.io/namespace: my-ns
      responses:
        '200':
          $ref: "#/components/responses/MeshTrafficPermissionList"
components:
  schemas:
    MeshTrafficPermissionItem:
      type: object
      description: "MeshTrafficPermission controls which services are allowed to communicate with each other in the mesh. It provides fine-grained access control by allowing you to define allow/deny rules based on service identity, enabling zero-trust security and supporting shadow mode for testing permission changes before enforcement."
      required: [type, name, spec]
      properties:
        type:
          description: 'the type of the resource'
          type: string
          enum:
            - MeshTrafficPermission
        mesh:
          description: 'Mesh is the name of the Kuma mesh this resource belongs to. It may be omitted for cluster-scoped resources.'
          type: string
          default: default
          # keep in sync with core_mesh.MeshNamePattern / MaxNameLength
          pattern: '^[0-9a-z-_.]*$'
          maxLength: 253
        kri:
          description: 'A unique identifier for this resource instance used by internal tooling and integrations. Typically derived from resource attributes and may be used for cross-references or indexing'
          type: string
          readOnly: true
          example: 'kri_mtp_default_zone-east_kuma-demo_mypolicy1_'
        name:
          description: 'Name of the Kuma resource'
          type: string
          # keep in sync with core_mesh.NamePattern / MaxNameLength
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
          maxLength: 253
        labels:
          additionalProperties:
            type: string
          description: 'The labels to help identity resources'
          type: object
        spec:
          description: Spec is the specification of the Kuma MeshTrafficPermission resource.
          properties:
            rules:
              description: Rules defines inbound permissions configuration
              items:
                properties:
                  default:
                    properties:
                      allow:
                        description: Allow definees a list of matches for which access will be allowed
                        items:
                          properties:
                            sni:
                              description: SNI defines a matcher configuration for matching by SNI value carried on the TLS connection
                              properties:
                                type:
                                  description: Type defines how to match traffic by SNI. Only `Exact` is supported.
                                  enum:
                                    - Exact
                                  type: string
                                value:
                                  description: Value is the SNI carried on the TLS connection that needs to match for the configuration to be applied
                                  type: string
                              required:
                                - type
                                - value
                              type: object
                            spiffeID:
                              description: SpiffeID defines a matcher configuration for SpiffeID matching
                              properties:
                                type:
                                  description: Type defines how to match incoming traffic by SpiffeID. `Exact` or `Prefix` are allowed.
                                  enum:
                                    - Exact
                                    - Prefix
                                  type: string
                                value:
                                  description: Value is SpiffeID of a client that needs to match for the configuration to be applied
                                  type: string
                              required:
                                - type
                                - value
                              type: object
                          type: object
                        type: array
                      allowWithShadowDeny:
                        description: |-
                          AllowWithShadowDeny defines a list of matches for which access will be allowed but emits logs as if
                          requests are denied
                        items:
                          properties:
                            sni:
                              description: SNI defines a matcher configuration for matching by SNI value carried on the TLS connection
                              properties:
                                type:
                                  description: Type defines how to match traffic by SNI. Only `Exact` is supported.
                                  enum:
                                    - Exact
                                  type: string
                                value:
                                  description: Value is the SNI carried on the TLS connection that needs to match for the configuration to be applied
                                  type: string
                              required:
                                - type
                                - value
                              type: object
                            spiffeID:
                              description: SpiffeID defines a matcher configuration for SpiffeID matching
                              properties:
                                type:
                                  description: Type defines how to match incoming traffic by SpiffeID. `Exact` or `Prefix` are allowed.
                                  enum:
                                    - Exact
                                    - Prefix
                                  type: string
                                value:
                                  description: Value is SpiffeID of a client that needs to match for the configuration to be applied
                                  type: string
                              required:
                                - type
                                - value
                              type: object
                          type: object
                        type: array
                      deny:
                        description: Deny defines a list of matches for which access will be denied
                        items:
                          properties:
                            sni:
                              description: SNI defines a matcher configuration for matching by SNI value carried on the TLS connection
                              properties:
                                type:
                                  description: Type defines how to match traffic by SNI. Only `Exact` is supported.
                                  enum:
                                    - Exact
                                  type: string
                                value:
                                  description: Value is the SNI carried on the TLS connection that needs to match for the configuration to be applied
                                  type: string
                              required:
                                - type
                                - value
                              type: object
                            spiffeID:
                              description: SpiffeID defines a matcher configuration for SpiffeID matching
                              properties:
                                type:
                                  description: Type defines how to match incoming traffic by SpiffeID. `Exact` or `Prefix` are allowed.
                                  enum:
                                    - Exact
                                    - Prefix
                                  type: string
                                value:
                                  description: Value is SpiffeID of a client that needs to match for the configuration to be applied
                                  type: string
                              required:
                                - type
                                - value
                              type: object
                          type: object
                        type: array
                    type: object
                required:
                  - default
                type: object
              type: array
            targetRef:
              description: |-
                TargetRef is a reference to the resource the policy takes an effect on.
                The resource could be either a real store object or virtual resource
                defined inplace.
              properties:
                kind:
                  description: Kind of the referenced resource
                  enum:
                    - Mesh
                    - Dataplane
                  type: string
                labels:
                  additionalProperties:
                    type: string
                  description: |-
                    Labels are used to select referenced real resources and to carry legacy
                    service identity when a common TargetRef must still target old
                    service-tag based paths.
                  type: object
                sectionName:
                  description: |-
                    SectionName is used to target specific section of resource.
                    For example, you can target port from MeshService.ports[] by its name. Only traffic to this port will be affected.
                  type: string
              required:
                - kind
              type: object
          type: object
        creationTime:
          readOnly: true
          type: string
          description: 'Time at which the resource was created'
          format: date-time
          example: '1901-01-01T00:00:00.000Z'
        modificationTime:
          readOnly: true
          type: string
          description: 'Time at which the resource was updated'
          format: date-time
          example: '1901-01-01T00:00:00.000Z'
  responses:
    MeshTrafficPermissionItem:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MeshTrafficPermissionItem'
    MeshTrafficPermissionList:
      description: List
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/MeshTrafficPermissionItem"
              total:
                type: number
                description: The total number of entities
              next:
                type: string
                description: URL to the next page
    MeshTrafficPermissionCreateOrUpdateSuccessResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              warnings:
                type: array
                readOnly: true
                description: |
                  warnings is a list of warning messages to return to the requesting Kuma API clients.
                  Warning messages describe a problem the client making the API request should correct or be aware of.
                items:
                  type: string
    MeshTrafficPermissionDeleteSuccessResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
