# should sort policies by scope: a mesh-wide policy before a namespaced one
type: MeshTimeout
name: matched-for-rules-bbb
mesh: mesh-1
labels:
  k8s.kuma.io/namespace: kuma-demo
spec:
  targetRef:
    kind: Mesh
  to:
    - targetRef:
        kind: Mesh
      default:
        connectionTimeout: 111s
        idleTimeout: 109s
---
type: MeshTimeout
name: matched-for-rules-aaa
mesh: mesh-1
spec:
  targetRef:
    kind: Mesh
  to:
    - targetRef:
        kind: Mesh
      default:
        connectionTimeout: 11s
        http:
          requestTimeout: 12s
---
# a policy in the system namespace is mesh-wide too, so it sorts before the namespaced one
type: MeshTimeout
name: matched-for-rules-ccc
mesh: mesh-1
labels:
  k8s.kuma.io/namespace: kuma-system
  kuma.io/policy-role: system
spec:
  targetRef:
    kind: Mesh
  to:
    - targetRef:
        kind: Mesh
      default:
        connectionTimeout: 211s
        http:
          requestTimeout: 212s
