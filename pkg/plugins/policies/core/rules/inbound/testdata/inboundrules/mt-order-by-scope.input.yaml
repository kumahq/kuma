# should sort policies by origin and then by scope: global, zone system, zone namespaced
type: MeshTimeout
name: matched-for-rules-ccc
mesh: mesh-1
labels:
  kuma.io/origin: zone
  k8s.kuma.io/namespace: kuma-demo
spec:
  rules:
    - default:
        connectionTimeout: 111s
        idleTimeout: 109s
---
type: MeshTimeout
name: matched-for-rules-bbb
mesh: mesh-1
labels:
  kuma.io/origin: zone
spec:
  rules:
    - default:
        connectionTimeout: 211s
        http:
          requestTimeout: 209s
---
type: MeshTimeout
name: matched-for-rules-aaa
mesh: mesh-1
labels:
  kuma.io/origin: global
spec:
  rules:
    - default:
        connectionTimeout: 11s
        http:
          requestTimeout: 12s
---
# a policy in the system namespace is zone-wide, so it sorts before the namespaced one
type: MeshTimeout
name: matched-for-rules-ddd
mesh: mesh-1
labels:
  kuma.io/origin: zone
  k8s.kuma.io/namespace: kuma-system
  kuma.io/policy-role: system
spec:
  rules:
    - default:
        connectionTimeout: 311s
        http:
          requestTimeout: 309s
