# combining policies using kind Dataplane selecting Dataplanes by labels with specific inbound selected by sectionName
type: MeshTrafficPermission
mesh: mesh-1
name: mtp-1
labels:
  k8s.kuma.io/namespace: kuma-system
  kuma.io/policy-role: system
spec:
  targetRef:
    kind: Dataplane
    labels:
      k8s.kuma.io/namespace: kuma-demo
  rules:
    - default:
        deny:
          - spiffeID:
              type: Prefix
              value: spiffe://mesh-1
---
type: MeshTrafficPermission
mesh: mesh-1
name: mtp-2
labels:
  k8s.kuma.io/namespace: kuma-system
  kuma.io/policy-role: system
spec:
  targetRef:
    kind: Dataplane
    labels:
      k8s.kuma.io/namespace: kuma-demo
    sectionName: main-port
  rules:
    - default:
        allow:
          - spiffeID:
              type: Prefix
              value: spiffe://mesh-1
