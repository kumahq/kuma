- name: kri_extsvc_default___externalservice_
  resource:
    '@type': type.googleapis.com/envoy.config.endpoint.v3.ClusterLoadAssignment
    clusterName: kri_extsvc_default___externalservice_
    endpoints:
    - lbEndpoints:
      - endpoint:
          address:
            socketAddress:
              address: 192.168.0.7
              portValue: 8007
        loadBalancingWeight: 1
        metadata:
          filterMetadata:
            envoy.lb:
              kuma.io/protocol: http2
            envoy.transport_socket_match:
              kuma.io/protocol: http2
