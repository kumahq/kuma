mesh: default
metadata:
  labels:
    app: mixed-proxy
    k8s.kuma.io/namespace: demo
    kuma.io/display-name: mixed-proxy
    kuma.io/listener-zoneegress: enabled
    kuma.io/mesh: default
  name: mixed-proxy
spec:
  networking:
    address: 192.168.0.1
    inbound:
    - health:
        ready: true
      port: 8080
      protocol: tcp
    listeners:
    - address: 192.168.0.1
      name: ze-main
      port: 10002
      type: ZoneEgress
