      kind: Service
      name: example
      uid: ""
    resourceVersion: "1"
  spec:
    ports:
    - appProtocol: tcp
      name: proxy
      port: 80
      targetPort: 8000
    - appProtocol: tcp
      name: proxy-tls
      port: 443
      targetPort: 8443
    selector:
      dataplaneLabels:
        matchLabels:
          app: gateway
          k8s.kuma.io/namespace: demo
  status:
    dataplaneProxies: {}
    tls: {}
    vips:
    - ip: 192.168.0.1
metadata: {}
