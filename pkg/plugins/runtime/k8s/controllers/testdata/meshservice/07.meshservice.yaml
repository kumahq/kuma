    labels:
      app: gateway
      k8s.kuma.io/is-headless-service: "false"
      k8s.kuma.io/service-name: example
      kuma.io/env: kubernetes
      kuma.io/managed-by: k8s-controller
      kuma.io/mesh: default
    name: example
    namespace: demo
    ownerReferences:
