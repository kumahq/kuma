mesh: poc
metadata:
  labels:
    app: sample
    k8s.kuma.io/namespace: demo
    kuma.io/display-name: pod-with-custom-admin-port
    kuma.io/env: kubernetes
    kuma.io/mesh: poc
    kuma.io/origin: zone
    kuma.io/proxy-type: sidecar
    kuma.io/zone: zone-1
  name: pod-with-custom-admin-port
  namespace: demo
  ownerReferences:
  - apiVersion: v1
    blockOwnerDeletion: true
    controller: true
    kind: Pod
    name: pod-with-custom-admin-port
    uid: pod-with-custom-admin-port-demo
  resourceVersion: "2"
spec:
  networking:
    address: 192.168.0.1
    admin:
      port: 9999
    inbound:
    - health: {}
      port: 8080
      protocol: http
      state: NotReady
