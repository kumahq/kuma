metadata:
  namespace: demo
  name: example
  labels:
    app: example
    version: "0.1"
  annotations:
    kuma.io/direct-access-services: "*"
    traffic.kuma.io/transparent-proxy-config: |
      redirect:
        inbound:
          port: 15006
        outbound:
          port: 15001
spec:
  containers:
    - ports:
        - containerPort: 7070
        - containerPort: 6060
          name: metrics
status:
  podIP: 192.168.0.1
