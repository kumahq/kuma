metadata:
  namespace: demo
  name: example
  labels:
    app: example
  annotations:
    traffic.kuma.io/transparent-proxy-config: |
      redirect:
        inbound:
          enabled: true
          excludePorts:
          - 8000
          port: 15006
        outbound:
          enabled: true
          port: 15001
spec:
  containers:
    - ports:
        - containerPort: 8000
        - containerPort: 8080
status:
  podIP: 192.168.0.1
