metadata:
  namespace: demo
  name: a-active
spec:
  clusterIP: 192.168.0.2
  selector:
    app: example
    rollouts-pod-template-hash: blue
  ports:
    - protocol: TCP
      appProtocol: http
      port: 80
      targetPort: main
