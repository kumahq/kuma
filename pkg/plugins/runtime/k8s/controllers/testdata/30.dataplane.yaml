mesh: default
metadata:
  labels:
    app: example
    k8s.kuma.io/namespace: demo
    k8s.kuma.io/service-account: test-sa
    kuma.io/display-name: example
    kuma.io/mesh: default
    kuma.io/workload: test-sa
    version: "0.1"
  name: example
spec:
  networking:
    address: 192.168.0.1
    inbound:
    - health:
        ready: true
      port: 8080
      protocol: http
    - health:
        ready: true
      port: 8443
      protocol: tcp
    - health:
        ready: true
      port: 7070
      protocol: tcp
  probes:
    endpoints:
    - inboundPath: /metrics
      inboundPort: 3001
      path: /3001/metrics
    port: 19000
